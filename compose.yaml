services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: clearsight
      POSTGRES_USER: clearsight
      POSTGRES_PASSWORD: clearsight
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearsight -d clearsight"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - clearsight-postgres:/var/lib/postgresql
      # - ./migrations:/docker-entrypoint-initdb.d:ro

  migrate:
    image: migrate/migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path=/migrations",
        "-database=postgres://clearsight:clearsight@postgres:5432/clearsight?sslmode=disable",
         "up"
      ]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      CLEARSIGHT_ENV: development
      CLEARSIGHT_HTTP_ADDR: :8080
      CLEARSIGHT_ALLOWED_ORIGIN: http://localhost:5173
      CLEARSIGHT_ARTIFACT_ROOT: /var/lib/clearsight/artifacts
      CLEARSIGHT_MAX_ARTIFACT_BYTES: 20971520
      CLEARSIGHT_CAPTURE_SESSION_TTL: 20m
      DATABASE_URL: postgres://clearsight:clearsight@postgres:5432/clearsight?sslmode=disable
    ports: ["8080:8080"]
    volumes:
      - clearsight-artifacts:/var/lib/clearsight/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
      # postgres:
      #   condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      CLEARSIGHT_ENV: development
      CLEARSIGHT_WORKER_ID: worker-compose
      CLEARSIGHT_WORKER_POLL: 1s
      DATABASE_URL: postgres://clearsight:clearsight@postgres:5432/clearsight?sslmode=disable
    depends_on:
      # postgres:
      #   condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    image: node:24.18.0-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports: ["5173:5173"]
    volumes:
      - ./web:/app
      - clearsight-node-modules:/app/node_modules
    depends_on: [api]

volumes:
  clearsight-postgres:
  clearsight-artifacts:
  clearsight-node-modules:
