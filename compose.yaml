name: clearsight

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: clearsight
      POSTGRES_USER: clearsight
      POSTGRES_PASSWORD: clearsight
    ports:
      - "5432:5432"
    volumes:
      - clearsight-postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearsight -d clearsight"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      CLEARSIGHT_HTTP_ADDR: :8080
      CLEARSIGHT_ENV: development
      CLEARSIGHT_ALLOWED_ORIGIN: http://localhost:5173
      DATABASE_URL: postgres://clearsight:clearsight@postgres:5432/clearsight?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:24.18.0-alpine
    working_dir: /workspace/web
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    volumes:
      - .:/workspace
      - clearsight-web-node-modules:/workspace/web/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  clearsight-postgres:
  clearsight-web-node-modules:
