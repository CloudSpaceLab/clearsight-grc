openapi: 3.1.0
info:
  title: ClearSight Foundation API
  version: 0.6.0
  description: >-
    Tenant-scoped API for authority routing, evidence capture, ongoing Programs,
    and specific Matters that require decisions, action, response or outcome checks.
servers:
  - url: http://localhost:8080
paths:
  /health/live:
    get:
      summary: Process liveness
      responses:
        '200': { description: Live }
  /health/ready:
    get:
      summary: Service readiness
      responses:
        '200': { description: Ready }
  /api/v1/context:
    get:
      summary: Current demonstration context
      responses:
        '200': { description: Current tenant, legal entity and actor context }
  /api/v1/today:
    get:
      summary: Work assigned to the current role
      responses:
        '200': { description: Reviews, approvals and evidence requests }

  /api/v1/authority/resolve:
    post:
      summary: Resolve the current responsible or authorized actor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveInput' }
      responses:
        '200': { description: Resolved authority }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { description: No eligible route }
  /api/v1/authority/simulate:
    post:
      summary: Test an authority route without changing work
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveInput' }
      responses:
        '200': { description: Routing simulation }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/authority/integrity:
    get:
      summary: List blocking routing configuration issues
      parameters: [ { $ref: '#/components/parameters/Tenant' } ]
      responses:
        '200': { description: Routing-integrity findings }
  /api/v1/authority/policies:
    get:
      summary: List active authority policies
      parameters: [ { $ref: '#/components/parameters/Tenant' } ]
      responses:
        '200': { description: Active policies }

  /api/v1/governance/policies:
    get:
      summary: List versioned routing policies
      parameters: [ { $ref: '#/components/parameters/Tenant' } ]
      responses:
        '200': { description: Routing policies }
    post:
      summary: Create a routing-policy draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyCreate' }
      responses:
        '201': { description: Draft created }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/governance/policies/{id}/{action}:
    post:
      summary: Submit, approve, reject or retire a routing policy
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [submit, approve, reject, retire] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GovernanceTransition' }
      responses:
        '200': { description: Policy updated }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/governance/delegations:
    get:
      summary: List delegations
      parameters: [ { $ref: '#/components/parameters/Tenant' } ]
      responses:
        '200': { description: Delegations }
    post:
      summary: Create a delegation draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DelegationCreate' }
      responses:
        '201': { description: Draft created }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/governance/delegations/{id}/{action}:
    post:
      summary: Submit, approve or revoke a delegation
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [submit, approve, revoke] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GovernanceTransition' }
      responses:
        '200': { description: Delegation updated }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/evidence/sources:
    get:
      summary: List registered evidence sources
      parameters:
        - { $ref: '#/components/parameters/Tenant' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Sources and current health }
    post:
      summary: Register an evidence source
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvidenceSourceCreate' }
      responses:
        '201': { description: Source registered }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/evidence/sources/{id}/observations:
    post:
      summary: Record source availability or freshness
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceObservation' }
      responses:
        '200': { description: Observation recorded and health updated }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/evidence/requests:
    get:
      summary: List evidence requests
      parameters:
        - { $ref: '#/components/parameters/Tenant' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Evidence requests }
    post:
      summary: Create a focused evidence request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvidenceRequestCreate' }
      responses:
        '201': { description: Request created }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/evidence/requests/{id}:
    get:
      summary: Get one evidence request
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/Tenant' }
      responses:
        '200': { description: Evidence request }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/evidence/requests/{id}/submissions:
    post:
      summary: Submit an internal response
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvidenceSubmission' }
      responses:
        '200': { description: Submission receipt }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/evidence/requests/{id}/invitations:
    post:
      summary: Issue a request-scoped invitation
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationCreate' }
      responses:
        '201': { description: Invitation issued }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/evidence/invitations/redeem:
    post:
      summary: Exchange an invitation for a bounded capture session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, minLength: 1 }
      responses:
        '200': { description: Bounded capture session }
        '401': { description: Invitation unavailable }
  /api/v1/evidence/invitations/{id}/revoke:
    post:
      summary: Revoke an invitation
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/Tenant' }
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/evidence/session:
    get:
      summary: Load the request for a capture session
      security: [ { CaptureSession: [] } ]
      responses:
        '200': { description: Session and request }
        '401': { description: Session unavailable }
  /api/v1/evidence/session/submissions:
    post:
      summary: Submit a response through a capture session
      security: [ { CaptureSession: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionSubmission' }
      responses:
        '200': { description: Submission receipt }
        '401': { description: Session unavailable }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/evidence/sessions/{id}/revoke:
    post:
      summary: Revoke a capture session
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/Tenant' }
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/evidence/artifacts:
    post:
      summary: Stream one evidence artifact
      description: New artifacts remain stored and unavailable until inspection is complete.
      security: [ {}, { CaptureSession: [] } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                tenant_id: { type: string }
                request_id: { type: string }
                submission_id: { type: string }
                created_by: { type: string }
                file: { type: string, format: binary }
      responses:
        '201': { description: Integrity manifest created }
        '401': { description: Session unavailable }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: File exceeds the configured limit }
        '415': { description: Media type not allowed }

  /api/v1/program-summaries:
    get:
      summary: List bounded Program summaries
      parameters:
        - { $ref: '#/components/parameters/Tenant' }
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Keyset-paginated Program summaries }
        '400': { description: Invalid cursor }
  /api/v1/matter-summaries:
    get:
      summary: List bounded issue and change summaries
      parameters:
        - { $ref: '#/components/parameters/Tenant' }
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, default: OPEN } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Keyset-paginated issue and change summaries }
        '400': { description: Invalid cursor }

  /api/v1/programs:
    get:
      summary: List ongoing Programs
      description: Returns requirements, controls, evidence checks and calculated status for a bounded tenant scope.
      parameters:
        - { $ref: '#/components/parameters/Tenant' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Program aggregates with human-readable status labels }
    post:
      summary: Create a Program in setup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgramCreate' }
      responses:
        '201': { description: Program created in DRAFT / Setup in progress }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/programs/{id}:
    get:
      summary: Get one Program
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/Tenant' }
      responses:
        '200': { description: Complete Program aggregate }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/programs/{id}/history:
    get:
      summary: Reconstruct a Program at a timestamp
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/Tenant' }
        - { $ref: '#/components/parameters/At' }
      responses:
        '200': { description: Program state at or before the supplied timestamp }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/programs/{id}/transition:
    post:
      summary: Activate, pause, resume or end a Program
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgramTransition' }
      responses:
        '200': { description: Program status updated }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/programs/{id}/requirements:
    post:
      summary: Add a source-linked requirement
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequirementCreate' }
      responses:
        '201': { description: Requirement added }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/programs/{id}/applicability:
    post:
      summary: Record whether a requirement applies
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicabilityCreate' }
      responses:
        '201': { description: Applicability decision recorded }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/programs/{id}/control-objectives:
    post:
      summary: Add the outcome a control must achieve
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ControlObjectiveCreate' }
      responses:
        '201': { description: Control objective added }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/programs/{id}/control-implementations:
    post:
      summary: Add the actual process, rule or practice used in scope
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ControlImplementationCreate' }
      responses:
        '201': { description: Control implementation added }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/programs/{id}/control-links:
    post:
      summary: Link a requirement to a control implementation
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequirementControlLink' }
      responses:
        '201': { description: Link added }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/programs/{id}/evidence-contracts:
    post:
      summary: Define what evidence is acceptable and how current it must be
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvidenceContractCreate' }
      responses:
        '201': { description: Evidence check defined }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/programs/{id}/evidence-assessments:
    post:
      summary: Record the current evidence result
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvidenceAssessmentCreate' }
      responses:
        '201': { description: Evidence result recorded and Program status recalculated }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/programs/{id}/triggers:
    post:
      summary: Record a change and create at most one linked open Matter
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgramTrigger' }
      responses:
        '202': { description: Trigger accepted; response states whether new work was created }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/matters:
    get:
      summary: List specific issues and changes
      description: Matter is the stable internal aggregate name; primary screens use Issues and changes.
      parameters:
        - { $ref: '#/components/parameters/Tenant' }
        - name: status
          in: query
          schema:
            type: string
            description: Use OPEN to exclude CLOSED and CANCELLED records.
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Matter aggregates with human-readable type, status and next action }
    post:
      summary: Create a specific issue or change
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatterCreate' }
      responses:
        '201': { description: Matter created }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/matters/{id}:
    get:
      summary: Get one Matter
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/Tenant' }
      responses:
        '200': { description: Complete Matter aggregate }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/matters/{id}/history:
    get:
      summary: Reconstruct a Matter at a timestamp
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/Tenant' }
        - { $ref: '#/components/parameters/At' }
      responses:
        '200': { description: Matter state at or before the supplied timestamp }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/matters/{id}/links:
    post:
      summary: Link an issue or change to another Program, requirement or control
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatterLinkCreate' }
      responses:
        '201': { description: Link added, or the existing identical link returned }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/matters/{id}/transition:
    post:
      summary: Move an issue or change to its next allowed stage
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatterTransition' }
      responses:
        '200': { description: Matter updated }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/matters/{id}/decisions:
    post:
      summary: Record a proposed or authorized decision
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionCreate' }
      responses:
        '201': { description: Decision recorded }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/matters/{id}/actions:
    post:
      summary: Add assigned work
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionCreate' }
      responses:
        '201': { description: Action added }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/matters/{id}/actions/{action_id}/transition:
    post:
      summary: Start, block, complete or cancel assigned work
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - name: action_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionTransition' }
      responses:
        '200': { description: Action status updated }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/matters/{id}/verification-contracts:
    post:
      summary: Define how the expected outcome will be checked
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OutcomeCheckCreate' }
      responses:
        '201': { description: Outcome check defined }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/matters/{id}/verification-results:
    post:
      summary: Record whether the expected outcome was achieved
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OutcomeResultCreate' }
      responses:
        '201': { description: Outcome result recorded; failure response applied }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/matters/{id}/responses:
    post:
      summary: Create an external response package
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResponsePackageCreate' }
      responses:
        '201': { description: Response package created }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/matters/{id}/responses/{response_id}/transition:
    post:
      summary: Review, approve, send or acknowledge a response package
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - name: response_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResponseTransition' }
      responses:
        '200': { description: Response package updated }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/workflow/tasks:
    get:
      summary: List tenant-scoped workflow tasks
      parameters:
        - { $ref: '#/components/parameters/Tenant' }
        - { name: principal_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Workflow tasks }
    post:
      summary: Create a workflow task
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowTaskCreate' }
      responses:
        '201': { description: Task created }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/workflow/tasks/{id}/transition:
    post:
      summary: Update a workflow task
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowTransition' }
      responses:
        '200': { description: Task updated }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/onboarding/guide:
    get:
      summary: Load a role-specific guide
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { type: string } }
      responses:
        '200': { description: Guide }
  /api/v1/onboarding/state:
    get:
      summary: Load a user's guide progress
      parameters:
        - { $ref: '#/components/parameters/Tenant' }
        - { name: principal_id, in: query, required: true, schema: { type: string } }
        - { name: guide_code, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Guide progress }
    put:
      summary: Save guide progress
      parameters:
        - { $ref: '#/components/parameters/Tenant' }
        - { name: principal_id, in: query, required: true, schema: { type: string } }
        - { name: guide_code, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardingUpdate' }
      responses:
        '200': { description: Guide progress saved }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/compliance/readiness:
    get:
      summary: Get readiness with explicit baseline state
      parameters: [ { $ref: '#/components/parameters/Tenant' } ]
      responses:
        '200': { description: Readiness dimensions and reasons }
  /api/v1/compliance/signals:
    post:
      summary: Accept an idempotent operational signal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Signal' }
      responses:
        '202': { description: Signal accepted and assessed }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/requests/{id}:
    get:
      deprecated: true
      summary: Load the legacy demonstration request
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      responses:
        '200': { description: Legacy request }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/requests/{id}/submit:
    post:
      deprecated: true
      summary: Submit the legacy demonstration request
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptureSubmission' }
      responses:
        '200': { description: Submission receipt }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/invitations/redeem:
    post:
      deprecated: true
      summary: Redeem the legacy demonstration invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200': { description: Legacy bounded session }
        '401': { description: Invitation unavailable }

components:
  securitySchemes:
    CaptureSession: { type: http, scheme: bearer, bearerFormat: opaque }
  parameters:
    Tenant:
      name: tenant_id
      in: query
      required: true
      schema: { type: string, minLength: 1 }
    ID:
      name: id
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200 }
    At:
      name: at
      in: query
      required: true
      schema: { type: string, format: date-time }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Record not found in the current scope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The record changed or the operation conflicts with current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: The request is valid JSON but violates a domain rule
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
    ResolveInput:
      type: object
      additionalProperties: false
      required: [tenant_id, legal_entity_id, object_type, object_id, responsibility, materiality]
      properties:
        tenant_id: { type: string }
        legal_entity_id: { type: string }
        object_type: { type: string }
        object_id: { type: string }
        responsibility: { type: string }
        decision_type: { type: string }
        materiality: { type: integer, minimum: 0, maximum: 5 }
    PolicyCreate:
      type: object
      additionalProperties: false
      required: [tenant_id, code, name, maker_id, definition]
      properties:
        tenant_id: { type: string }
        code: { type: string }
        name: { type: string }
        maker_id: { type: string }
        effective_from: { type: string, format: date-time }
        definition: { type: object }
    DelegationCreate:
      type: object
      additionalProperties: false
      required: [tenant_id, from_principal_id, to_principal_id, responsibility, starts_at, ends_at, maker_id]
      properties:
        tenant_id: { type: string }
        from_principal_id: { type: string }
        to_principal_id: { type: string }
        responsibility: { type: string }
        scope: { type: object }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        reason: { type: string }
        maker_id: { type: string }
    GovernanceTransition:
      type: object
      additionalProperties: false
      required: [tenant_id, actor_id, expected_version]
      properties:
        tenant_id: { type: string }
        actor_id: { type: string }
        expected_version: { type: integer, minimum: 1 }
        rationale: { type: string }
    EvidenceSourceCreate:
      type: object
      additionalProperties: false
      required: [tenant_id, code, name, type, authority_class, expected_freshness_minutes]
      properties:
        tenant_id: { type: string }
        legal_entity_id: { type: string }
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [REGULATORY, SYSTEM, DOCUMENT, HUMAN, VENDOR] }
        authority_class: { type: string }
        owner_principal_id: { type: string }
        endpoint: { type: string }
        expected_freshness_minutes: { type: integer, minimum: 1 }
    SourceObservation:
      type: object
      additionalProperties: false
      required: [tenant_id, observed_at, success]
      properties:
        tenant_id: { type: string }
        observed_at: { type: string, format: date-time }
        success: { type: boolean }
        unavailable: { type: boolean }
        latency_ms: { type: integer, minimum: 0 }
        detail: { type: string }
        recorded_by: { type: string }
    EvidenceRequestCreate:
      type: object
      additionalProperties: false
      required: [tenant_id, subject_type, subject_id, title, purpose, why_you, sensitivity, audience_type, estimated_minutes, deadline, fields]
      properties:
        tenant_id: { type: string }
        subject_type: { type: string }
        subject_id: { type: string }
        title: { type: string }
        purpose: { type: string }
        why_you: { type: string }
        sensitivity: { type: string }
        audience_type: { type: string, enum: [INTERNAL, EXTERNAL, CUSTOMER, VENDOR, AUTHORITY] }
        estimated_minutes: { type: integer, minimum: 1, maximum: 60 }
        deadline: { type: string, format: date-time }
        known_facts: { type: object, additionalProperties: { type: string } }
        fields: { type: array, minItems: 1, items: { type: object } }
        created_by: { type: string }
    EvidenceSubmission:
      type: object
      additionalProperties: false
      required: [tenant_id, expected_version, answers]
      properties:
        tenant_id: { type: string }
        expected_version: { type: integer, minimum: 1 }
        answers: { type: object, additionalProperties: { type: string } }
        submitted_by: { type: string }
    SessionSubmission:
      type: object
      additionalProperties: false
      required: [expected_version, answers]
      properties:
        expected_version: { type: integer, minimum: 1 }
        answers: { type: object, additionalProperties: { type: string } }
    InvitationCreate:
      type: object
      additionalProperties: false
      required: [tenant_id, audience, purpose, ttl_minutes]
      properties:
        tenant_id: { type: string }
        audience: { type: string }
        purpose: { type: string }
        ttl_minutes: { type: integer, minimum: 1 }
        created_by: { type: string }

    ProgramCreate:
      type: object
      additionalProperties: false
      required: [tenant_id, code, name, type, owning_function, effective_from]
      properties:
        tenant_id: { type: string }
        legal_entity_id: { type: string }
        code: { type: string }
        name: { type: string }
        type: { type: string }
        owning_function: { type: string }
        owner_principal_id: { type: string }
        authority_principal_id: { type: string }
        jurisdiction: { type: string }
        scope: { type: object }
        effective_from: { type: string, format: date-time }
        effective_until: { type: string, format: date-time }
        actor_id: { type: string }
    ProgramTransition:
      type: object
      additionalProperties: false
      required: [tenant_id, expected_version, to, actor_id, rationale]
      properties:
        tenant_id: { type: string }
        expected_version: { type: integer, minimum: 1 }
        to: { type: string, enum: [ACTIVE, PAUSED, RETIRED] }
        actor_id: { type: string }
        rationale: { type: string, minLength: 1 }
    RequirementCreate:
      type: object
      additionalProperties: false
      required: [tenant_id, expected_version, code, title, statement, modality, status, effective_from]
      properties:
        tenant_id: { type: string }
        expected_version: { type: integer, minimum: 1 }
        source_id: { type: string }
        code: { type: string }
        title: { type: string }
        statement: { type: string }
        source_anchor: { type: string }
        modality: { type: string, enum: [MUST, MUST_NOT, MAY, EXPECTED] }
        actor: { type: string }
        action: { type: string }
        object: { type: string }
        status: { type: string, enum: [DRAFT, APPROVED, SUPERSEDED, RETIRED] }
        effective_from: { type: string, format: date-time }
        actor_id: { type: string }
    ApplicabilityCreate:
      type: object
      additionalProperties: false
      required: [tenant_id, expected_version, requirement_id, status, scope, rationale, approved_by, effective_from]
      properties:
        tenant_id: { type: string }
        expected_version: { type: integer, minimum: 1 }
        requirement_id: { type: string }
        status: { type: string, enum: [POTENTIALLY_APPLICABLE, APPLICABLE, PARTIALLY_APPLICABLE, NOT_APPLICABLE, APPLIES_LATER, SUPERSEDED] }
        scope: { type: object }
        rationale: { type: string }
        approved_by: { type: string }
        effective_from: { type: string, format: date-time }
    ControlObjectiveCreate:
      type: object
      additionalProperties: false
      required: [tenant_id, expected_version, code, name, outcome, status]
      properties:
        tenant_id: { type: string }
        expected_version: { type: integer, minimum: 1 }
        code: { type: string }
        name: { type: string }
        outcome: { type: string }
        status: { type: string, enum: [DRAFT, ACTIVE, RETIRED] }
        actor_id: { type: string }
    ControlImplementationCreate:
      type: object
      additionalProperties: false
      required: [tenant_id, expected_version, objective_id, name, description, implementation_type, scope, status, effective_from]
      properties:
        tenant_id: { type: string }
        expected_version: { type: integer, minimum: 1 }
        objective_id: { type: string }
        name: { type: string }
        description: { type: string }
        implementation_type: { type: string }
        owner_principal_id: { type: string }
        scope: { type: object }
        status: { type: string, enum: [PLANNED, IN_PROGRESS, IMPLEMENTED, INACTIVE, RETIRED] }
        effective_from: { type: string, format: date-time }
        actor_id: { type: string }
    RequirementControlLink:
      type: object
      additionalProperties: false
      required: [tenant_id, expected_version, requirement_id, implementation_id]
      properties:
        tenant_id: { type: string }
        expected_version: { type: integer, minimum: 1 }
        requirement_id: { type: string }
        implementation_id: { type: string }
        actor_id: { type: string }
    EvidenceContractCreate:
      type: object
      additionalProperties: false
      required: [tenant_id, expected_version, code, name, claim, acceptable_source_ids, population_scope, freshness_minutes, minimum_coverage, contradiction_policy, failure_action, status]
      properties:
        tenant_id: { type: string }
        expected_version: { type: integer, minimum: 1 }
        requirement_id: { type: string }
        control_implementation_id: { type: string }
        code: { type: string }
        name: { type: string }
        claim: { type: string }
        acceptable_source_ids: { type: array, items: { type: string } }
        population_scope: { type: object }
        freshness_minutes: { type: integer, minimum: 1 }
        minimum_coverage: { type: number, minimum: 0, maximum: 1 }
        independence_required: { type: boolean }
        contradiction_policy: { type: string, enum: [HOLD, REVIEW, FAIL] }
        failure_action: { type: string, enum: [FLAG, REQUEST, MATTER, BLOCK] }
        status: { type: string, enum: [DRAFT, ACTIVE, RETIRED] }
        actor_id: { type: string }
    EvidenceAssessmentCreate:
      type: object
      additionalProperties: false
      required: [tenant_id, expected_version, contract_id, conclusion, coverage, basis, assessed_at]
      properties:
        tenant_id: { type: string }
        expected_version: { type: integer, minimum: 1 }
        contract_id: { type: string }
        conclusion: { type: string, enum: [SUPPORTED, PARTIALLY_SUPPORTED, UNSUPPORTED, CONTRADICTED, INDETERMINATE, EXPIRED] }
        coverage: { type: number, minimum: 0, maximum: 1 }
        basis: { type: object }
        valid_until: { type: string, format: date-time }
        assessed_by: { type: string }
        assessed_at: { type: string, format: date-time }
    ProgramTrigger:
      type: object
      additionalProperties: false
      required: [tenant_id, type, dedupe_key, observed_at, source]
      properties:
        tenant_id: { type: string }
        type: { type: string }
        subject_type: { type: string }
        subject_id: { type: string }
        dedupe_key: { type: string }
        payload: { type: object }
        observed_at: { type: string, format: date-time }
        source: { type: string }

    MatterCreate:
      type: object
      additionalProperties: false
      required: [tenant_id, type, priority, title, summary, scope]
      properties:
        tenant_id: { type: string }
        type:
          type: string
          enum: [REGULATORY_CHANGE, SUPERVISORY_FINDING, AUTHORITY_REQUEST, RISK_SITUATION, CONTROL_GAP, AUDIT_FINDING, EXCEPTION, INCIDENT, OPERATIONAL_LOSS, DATA_BREACH, VENDOR_DEFICIENCY, CUSTOMER_CONCERN, OVERDUE_OBLIGATION, FAILED_VERIFICATION, EVIDENCE_CONTRADICTION, KRI_BREACH]
        priority: { type: integer, minimum: 1, maximum: 5 }
        title: { type: string }
        summary: { type: string }
        scope: { type: object }
        source_type: { type: string }
        source_id: { type: string }
        known_facts: { type: object }
        missing_facts: { type: array, items: { type: string } }
        contradictions: { type: array, items: { type: object } }
        owner_principal_id: { type: string }
        required_authority: { type: string }
        due_at: { type: string, format: date-time }
        program_id: { type: string }
        requirement_id: { type: string }
        control_id: { type: string }
        actor_id: { type: string }
    MatterLinkCreate:
      type: object
      additionalProperties: false
      required: [tenant_id, expected_version, program_id]
      properties:
        tenant_id: { type: string }
        expected_version: { type: integer, minimum: 1 }
        program_id: { type: string }
        requirement_id: { type: string }
        control_id: { type: string }
        relationship: { type: string, default: AFFECTS }
        actor_id: { type: string }
    MatterTransition:
      type: object
      additionalProperties: false
      required: [tenant_id, expected_version, to]
      properties:
        tenant_id: { type: string }
        expected_version: { type: integer, minimum: 1 }
        to: { type: string, enum: [TRIAGE, ASSESSMENT, DECISION_REQUIRED, ACTION_IN_PROGRESS, RESPONSE_PREPARATION, VERIFICATION, CLOSED, CANCELLED] }
        actor_id: { type: string }
        rationale: { type: string }
    DecisionCreate:
      type: object
      additionalProperties: false
      required: [tenant_id, expected_version, type, status, options, rationale, conditions]
      properties:
        tenant_id: { type: string }
        expected_version: { type: integer, minimum: 1 }
        type: { type: string }
        status: { type: string, enum: [PROPOSED, APPROVED, CONDITIONALLY_APPROVED, REJECTED, RETURNED, EXPIRED, SUPERSEDED] }
        options: { type: array, items: { type: object } }
        selected_option: { type: string }
        rationale: { type: string }
        conditions: { type: array, items: { type: object } }
        authority_principal_id: { type: string }
        expires_at: { type: string, format: date-time }
    ActionCreate:
      type: object
      additionalProperties: false
      required: [tenant_id, expected_version, title, description]
      properties:
        tenant_id: { type: string }
        expected_version: { type: integer, minimum: 1 }
        title: { type: string }
        description: { type: string }
        owner_principal_id: { type: string }
        due_at: { type: string, format: date-time }
        actor_id: { type: string }
    ActionTransition:
      type: object
      additionalProperties: false
      required: [tenant_id, expected_version, to, rationale]
      properties:
        tenant_id: { type: string }
        expected_version: { type: integer, minimum: 1 }
        to: { type: string, enum: [IN_PROGRESS, BLOCKED, IMPLEMENTED, CANCELLED] }
        actor_id: { type: string }
        rationale: { type: string }
    OutcomeCheckCreate:
      type: object
      additionalProperties: false
      required: [tenant_id, expected_version, expected_outcome, baseline, scope, threshold, failure_response]
      properties:
        tenant_id: { type: string }
        expected_version: { type: integer, minimum: 1 }
        action_id: { type: string }
        expected_outcome: { type: string }
        baseline: { type: object }
        scope: { type: object }
        measurement_source_id: { type: string }
        threshold: { type: object }
        observation_period_minutes: { type: integer, minimum: 0 }
        authority_principal_id: { type: string }
        failure_response: { type: string, enum: [REOPEN, ESCALATE, CREATE_MATTER, BLOCK_CLOSE] }
        actor_id: { type: string }
    OutcomeResultCreate:
      type: object
      additionalProperties: false
      required: [tenant_id, expected_version, contract_id, result, observations, evidence_references, rationale, observed_at]
      properties:
        tenant_id: { type: string }
        expected_version: { type: integer, minimum: 1 }
        contract_id: { type: string }
        result: { type: string, enum: [PASS, FAIL, INCONCLUSIVE] }
        observations: { type: object }
        evidence_references: { type: array, items: { type: object } }
        reviewer_principal_id: { type: string }
        rationale: { type: string }
        observed_at: { type: string, format: date-time }
    ResponsePackageCreate:
      type: object
      additionalProperties: false
      required: [tenant_id, expected_version, purpose, audience, manifest]
      properties:
        tenant_id: { type: string }
        expected_version: { type: integer, minimum: 1 }
        purpose: { type: string }
        audience: { type: string }
        manifest: { type: array, items: { type: object } }
        actor_id: { type: string }
    ResponseTransition:
      type: object
      additionalProperties: false
      required: [tenant_id, expected_version, to, rationale]
      properties:
        tenant_id: { type: string }
        expected_version: { type: integer, minimum: 1 }
        to: { type: string, enum: [IN_REVIEW, APPROVED, TRANSMITTED, ACKNOWLEDGED, REJECTED, WITHDRAWN] }
        actor_id: { type: string }
        rationale: { type: string }

    WorkflowTaskCreate:
      type: object
      additionalProperties: false
      required: [tenant_id, workflow_id, step_key, responsibility, title]
      properties:
        tenant_id: { type: string }
        workflow_id: { type: string }
        step_key: { type: string }
        responsibility: { type: string }
        principal_id: { type: string }
        title: { type: string }
        due_at: { type: string, format: date-time }
        context: { type: object, additionalProperties: { type: string } }
    WorkflowTransition:
      type: object
      additionalProperties: false
      required: [tenant_id, status, expected_version]
      properties:
        tenant_id: { type: string }
        actor_id: { type: string }
        status: { type: string, enum: [READY, IN_PROGRESS, BLOCKED, ESCALATED, COMPLETED, CANCELLED] }
        expected_version: { type: integer, minimum: 1 }
        reason: { type: string }
    OnboardingUpdate:
      type: object
      additionalProperties: false
      required: [current_step, expected_version]
      properties:
        current_step: { type: integer, minimum: 0 }
        completed: { type: boolean }
        dismissed: { type: boolean }
        expected_version: { type: integer, minimum: 0 }
    Signal:
      type: object
      additionalProperties: false
      required: [tenant_id, type, subject_type, subject_id, dedupe_key, source]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        type: { type: string }
        subject_type: { type: string }
        subject_id: { type: string }
        dedupe_key: { type: string }
        source: { type: string }
        observed_at: { type: string, format: date-time }
        effective_at: { type: string, format: date-time }
        payload: { type: object, additionalProperties: { type: string } }
    CaptureSubmission:
      type: object
      additionalProperties: false
      required: [version, answers]
      properties:
        version: { type: integer, minimum: 1 }
        answers: { type: object, additionalProperties: { type: string } }
