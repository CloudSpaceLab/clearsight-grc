openapi: 3.1.0
info:
  title: ClearSight Bank Journey API
  version: 0.9.0
  description: >-
    Focused contract for verified-actor context, actor-scoped Today work and
    connected bank reference journeys. This document supplements the primary
    foundation contract while retaining explicit journey schemas and examples.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/context:
    get:
      summary: Get verified runtime context
      responses:
        '200':
          description: Verified tenant, legal entity, actor and runtime mode
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeContext' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/today:
    get:
      summary: List actor-visible current work
      responses:
        '200':
          description: Current open work derived from actor-visible journey state
          content:
            application/json:
              schema:
                type: object
                required: [items, generated_at]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AttentionItem' }
                  generated_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/bank-journeys:
    get:
      summary: List visible connected bank journeys
      description: >-
        Returns journey projections for the verified actor's tenant. Restricted
        journeys are omitted unless the actor's principal appears in the Matter's
        valid explicit allow-list. Client tenant parameters are neither required
        nor trusted.
      responses:
        '200':
          description: Visible journey projections and current actionable targets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankJourneysResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  responses:
    Unauthorized:
      description: Verified identity is missing, invalid or expired
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Record or organization scope was not found without disclosing hidden data
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: The current projection could not be loaded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unavailable:
      description: The required service is unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    RuntimeContext:
      type: object
      required: [tenant, legal_entity, actor, mode]
      properties:
        tenant: { $ref: '#/components/schemas/NamedScope' }
        legal_entity: { $ref: '#/components/schemas/NamedScope' }
        actor:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
            kind: { type: string }
            assurance_level: { type: string }
            authentication: { type: string }
            session_id: { type: string }
        mode: { type: string, enum: [memory, postgres] }
    NamedScope:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    AttentionItem:
      type: object
      required: [id, type, title, why_now, scope, state, evidence, owner, due_at, primary_action]
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: string }
        why_now: { type: string }
        scope: { type: string }
        state: { type: string }
        evidence: { type: string }
        owner: { type: string }
        due_at: { type: string, format: date-time }
        primary_action: { type: string }
        action_target_type: { $ref: '#/components/schemas/JourneyActionTarget' }
        action_target_id: { type: string }
    BankJourneysResponse:
      type: object
      required: [items, generated_at, sample]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BankJourney' }
        generated_at: { type: string, format: date-time }
        sample: { type: boolean }
    BankJourney:
      type: object
      required:
        - code
        - title
        - summary
        - status
        - status_label
        - next_action
        - owner
        - action_available
        - completed_steps
        - total_steps
        - steps
        - source_names
        - sensitive
        - sample
      properties:
        code:
          type: string
          enum: [NDPA_CONTINUOUS, REGULATORY_CHANGE, AUTHORITY_REQUEST, FINDING_REMEDIATION]
        title: { type: string }
        summary: { type: string }
        status: { type: string }
        status_label: { type: string }
        next_action: { type: string }
        owner: { type: string }
        owner_principal_id: { type: string }
        program_id: { type: string }
        matter_id: { type: string }
        evidence_request_id: { type: string }
        action_target_type: { $ref: '#/components/schemas/JourneyActionTarget' }
        action_target_id: { type: string }
        action_label: { type: string }
        action_available: { type: boolean }
        action_unavailable_reason: { type: string }
        due_at: { type: string, format: date-time }
        completed_steps: { type: integer, minimum: 0 }
        total_steps: { type: integer, minimum: 0 }
        steps:
          type: array
          items: { $ref: '#/components/schemas/JourneyStep' }
        source_names:
          type: array
          items: { type: string }
        sensitive: { type: boolean }
        sample: { type: boolean }
        updated_at: { type: string, format: date-time }
    JourneyActionTarget:
      type: string
      enum: [PROGRAM, MATTER, EVIDENCE_REQUEST]
    JourneyStep:
      type: object
      required: [code, label, complete]
      properties:
        code: { type: string }
        label: { type: string }
        complete: { type: boolean }
