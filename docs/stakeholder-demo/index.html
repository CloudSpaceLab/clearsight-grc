<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClearSight stakeholder reference demo</title>
<style>
:root{color-scheme:dark;--bg:#07101c;--panel:#0c1928;--panel2:#112337;--line:#243b52;--text:#edf7fb;--muted:#8ea5b7;--cyan:#62d5e6;--green:#62c99a;--amber:#e7b65c;--red:#ed7481;--shadow:0 26px 80px rgba(0,0,0,.35)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 80% 10%,rgba(54,139,166,.13),transparent 32%),linear-gradient(145deg,#06101b,#091827 60%,#07111c);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button{font:inherit}.shell{display:grid;grid-template-columns:92px 1fr;min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:92px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;border-right:1px solid var(--line);background:rgba(7,16,28,.88);backdrop-filter:blur(20px);z-index:10}.brand{width:44px;height:44px;display:grid;place-items:center;border:1px solid rgba(98,213,230,.4);border-radius:14px;color:var(--cyan);font-weight:900;font-size:20px;background:rgba(98,213,230,.07);box-shadow:0 0 28px rgba(98,213,230,.08)}nav{display:grid;gap:9px;margin-top:30px;width:100%}.nav{border:0;border-radius:12px;padding:9px 4px;display:grid;place-items:center;gap:4px;color:var(--muted);background:transparent;cursor:pointer}.nav:hover,.nav.active{color:var(--cyan);background:rgba(98,213,230,.08)}.nav svg{width:22px;height:22px}.nav span{font-size:9px}.avatar{margin-top:auto;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,#245a72,#152f4b);border:1px solid #3b6e87;font-weight:800}.main{grid-column:2;padding:24px clamp(20px,4vw,58px) 70px;max-width:1540px;width:100%}.context{position:sticky;top:10px;z-index:8;display:flex;justify-content:space-between;align-items:center;padding:11px 14px;margin-bottom:34px;border:1px solid rgba(58,86,111,.8);border-radius:14px;background:rgba(8,18,30,.85);backdrop-filter:blur(18px);box-shadow:0 12px 34px rgba(0,0,0,.16)}.context div{display:flex;align-items:center;gap:10px}.context small,.muted{color:var(--muted)}.demo{padding:5px 9px;border:1px solid rgba(231,182,92,.3);border-radius:99px;color:var(--amber);font-size:9px;letter-spacing:.08em;text-transform:uppercase;background:rgba(231,182,92,.07)}header{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin:0 0 30px}.eyebrow{color:var(--cyan);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:800}h1{font-size:clamp(42px,6vw,72px);line-height:.95;margin:10px 0 14px;letter-spacing:-.045em}h2{font-size:22px;margin:0 0 8px}h3{font-size:15px;margin:0 0 6px}p{color:#b6c7d4;margin:0}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:11px;padding:11px 14px;color:var(--text);background:var(--panel2);cursor:pointer}.btn.primary{border-color:rgba(98,213,230,.55);background:linear-gradient(135deg,#187b91,#13556f);box-shadow:0 10px 26px rgba(12,111,133,.24)}.btn:hover{transform:translateY(-1px)}.connection{padding:8px 11px;border-radius:99px;border:1px solid rgba(98,201,154,.3);color:var(--green);font-size:10px;background:rgba(98,201,154,.07)}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat,.panel,.card,.hero{border:1px solid var(--line);border-radius:16px;background:linear-gradient(150deg,rgba(17,35,55,.92),rgba(10,23,38,.94));box-shadow:0 16px 50px rgba(0,0,0,.11)}.stat{padding:17px}.stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.stat strong{display:block;font-size:29px;margin:5px 0}.stat small{color:var(--muted)}.hero{padding:26px;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px;align-items:center;margin-bottom:24px;overflow:hidden}.orb{height:160px;position:relative}.orb:before,.orb:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(98,213,230,.35);inset:20px}.orb:after{inset:48px;background:radial-gradient(circle,rgba(98,213,230,.22),rgba(28,80,103,.08) 55%,transparent 56%);box-shadow:0 0 45px rgba(98,213,230,.14)}.orb i{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--cyan);box-shadow:0 0 18px var(--cyan)}.orb i:nth-child(1){top:25px;left:50%}.orb i:nth-child(2){bottom:28px;left:29px;background:var(--green)}.orb i:nth-child(3){right:26px;bottom:36px;background:var(--amber)}.section-title{display:flex;justify-content:space-between;align-items:end;margin:28px 0 13px}.list{display:grid;gap:12px}.attention{display:grid;grid-template-columns:48px minmax(0,1fr) 220px;gap:16px;padding:18px}.icon{width:42px;height:42px;display:grid;place-items:center;border:1px solid rgba(98,213,230,.24);border-radius:12px;color:var(--cyan);background:rgba(98,213,230,.06)}.kicker{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.07em}.attention h3{font-size:17px;margin-top:8px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.meta span,.pill{padding:5px 8px;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:10px}.next{padding-left:17px;border-left:1px solid var(--line);display:grid;align-content:center;gap:5px}.next span{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.08em}.next button{justify-self:start;padding:0;border:0;background:none;color:var(--cyan);cursor:pointer}.toolbar{display:grid;grid-template-columns:minmax(0,1fr) 180px auto;gap:10px;margin-bottom:14px}.toolbar input,.toolbar select,.field{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:#0a1726;color:var(--text)}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:17px;border-top:1px solid var(--line)}.row:first-child{border-top:0}.row button{all:unset;cursor:pointer;display:grid;gap:4px}.row mark{color:var(--amber);background:rgba(231,182,92,.08);padding:6px 9px;border-radius:99px}.detail{padding:20px;border-top:1px solid var(--line);display:grid;gap:18px;background:rgba(5,14,24,.35)}dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:0}dl div{padding:12px;border:1px solid var(--line);border-radius:11px}dt{color:var(--muted);font-size:10px;text-transform:uppercase}dd{margin:5px 0 0;overflow-wrap:anywhere}.proposal{padding:16px;border:1px solid rgba(98,213,230,.22);border-radius:13px;background:rgba(98,213,230,.035)}blockquote{margin:12px 0;padding:12px;border-left:3px solid var(--cyan);color:#cfe4eb;background:rgba(98,213,230,.05)}.mobile{display:none}.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:rgba(1,6,11,.76);backdrop-filter:blur(14px)}.guide{width:min(950px,100%);display:grid;grid-template-columns:38% 62%;border:1px solid rgba(98,213,230,.32);border-radius:22px;overflow:hidden;background:#0a1726;box-shadow:var(--shadow)}.guide-art{display:grid;place-items:center;background:radial-gradient(circle at center,rgba(98,213,230,.12),transparent 60%)}.guide-copy{padding:42px}.progress{display:grid;gap:7px;margin:22px 0}.progress div{padding:9px 11px;border:1px solid var(--line);border-radius:10px;color:var(--muted)}.progress .active{color:var(--text);border-color:rgba(98,213,230,.5);background:rgba(98,213,230,.06)}.guide-actions{display:flex;justify-content:space-between;align-items:center}.close{position:absolute;right:22px;top:18px;border:0;background:none;color:#c9d8e1;font-size:25px;cursor:pointer}.hidden{display:none!important}.footer-note{margin-top:30px;padding:14px;border:1px solid rgba(231,182,92,.25);border-radius:12px;color:#d9c38f;background:rgba(231,182,92,.05)}@media(max-width:850px){body{padding-bottom:74px}.shell{display:block}.side{display:none}.main{padding:16px 16px 36px}.context small{display:none}.grid3{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.orb{display:none}.attention{grid-template-columns:1fr}.icon{display:none}.next{border-left:0;border-top:1px solid var(--line);padding:13px 0 0}.toolbar{grid-template-columns:1fr}.guide{grid-template-columns:1fr}.guide-art{display:none}.mobile{position:fixed;left:8px;right:8px;bottom:8px;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);padding:6px;border:1px solid var(--line);border-radius:16px;background:rgba(8,18,30,.94);backdrop-filter:blur(18px)}.mobile button{border:0;border-radius:10px;padding:8px 3px;color:var(--muted);background:transparent;font-size:9px}.mobile button.active{color:var(--cyan);background:rgba(98,213,230,.08)}dl{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell"><aside class="side"><div class="brand">C</div><nav id="nav"></nav><div class="avatar">CR</div></aside><main class="main"><div class="context"><div><strong>Meridian Trust Bank</strong><small>Meridian Trust Bank Nigeria</small></div><div><small>Chief Risk Officer</small><span class="demo">Stakeholder demo</span></div></div><div id="app"></div><div class="footer-note">Reference deployment · No customer or bank production data · Static records demonstrate the reviewed UI and workflows.</div></main></div><nav class="mobile" id="mobile"></nav><div id="tour"></div>
<script>
const views=[['today','Today'],['programs','Programs'],['work','Work'],['imports','Imports'],['configure','Configure']];
const icons={today:'▦',programs:'▤',work:'◇',imports:'⇧',configure:'⚙'};
const record={program:'Nigeria Data Protection Programme',matter:'Implement GAID annual-return evidence requirements'};
function nav(){let current=(location.hash.slice(1).split('/')[0]||'today');for(const id of ['nav','mobile'])document.getElementById(id).innerHTML=views.map(([v,l])=>`<button class="${v===current?'nav active':'nav'}" onclick="location.hash='${v}'"><b>${icons[v]}</b><span>${l}</span></button>`).join('')}
function header(kicker,title,copy,actions=''){return `<header><div><span class="eyebrow">${kicker}</span><h1>${title}</h1><p>${copy}</p></div><div class="actions">${actions}</div></header>`}
function today(){return header('Meridian Trust Bank · Operating brief','Today','Reviews, approvals, evidence requests and escalations assigned to your verified role.','<span class="connection">Reference data</span><button class="btn">View approval route</button><button class="btn primary">Open evidence request</button>')+`<section class="grid3"><div class="stat"><span>Open items</span><strong>3</strong><small>Assigned to you</small></div><div class="stat"><span>Due within 4 days</span><strong>3</strong><small>Excludes overdue items</small></div><div class="stat"><span>Items up to date</span><strong>3</strong><small>No action due</small></div></section><section class="hero"><div><span class="eyebrow">Readiness</span><h2>At risk</h2><p>Two annual-return evidence sections remain incomplete. The population is connected and the missing work is explicitly identified.</p><div class="meta"><span>3 current</span><span>2 at risk</span><span>2 awaiting review</span></div></div><div class="orb"><i></i><i></i><i></i></div></section><div class="section-title"><div><h2>Assigned to you</h2><p>Each item opens the exact Program, issue or evidence request.</p></div></div><section class="list">${attention('Regulatory change','Action in progress',record.matter,'The source change is approved and two evidence sections still need owners before the internal review.','8 of 10 sections complete','work/matters/matter-gaid-change')}${attention('Evidence request','Response required','Confirm the remaining annual-return evidence owners','Known facts are prefilled; provide only the two unresolved details.','Known facts prefilled','work/evidence/evidence-annual-return')}${attention('Program','Evidence incomplete',record.program,'The latest status is evidence incomplete, not current.','5 evidence checks','programs/program-ndpa')}</section>`}
function attention(type,state,title,why,evidence,route){return `<article class="card attention"><div class="icon">${icons[type==='Program'?'programs':'work']}</div><div><div class="kicker"><span>${state}</span><time>Aug 9, 4:30 PM</time></div><h3>${title}</h3><p>${why}</p><div class="meta"><span>${type}</span><span>${evidence}</span><span>Data Protection Office</span></div></div><div class="next"><span>Required action</span><strong>Review the exact record and complete the next step</strong><button onclick="location.hash='${route}'">Open exact record</button></div></article>`}
function programs(){return header('Meridian Trust Bank','Programs','Ongoing obligations, safeguards, evidence checks and open issues.')+`<section class="hero"><div><span class="eyebrow">Ongoing compliance</span><h2>1 loaded programme has incomplete evidence</h2><p>Requirements, safeguards, evidence checks and open issues for ongoing responsibilities.</p></div><div class="orb"><i></i><i></i><i></i></div></section><div class="toolbar"><input class="field" placeholder="Search programmes"><select class="field"><option>All statuses</option><option>Active</option></select><button class="btn">Search</button></div><article class="panel"><div class="row"><button onclick="toggle('program-detail')"><span class="eyebrow">NDPA · Data Protection Office</span><h3>${record.program}</h3><small class="muted">Nigeria · 5 requirements · 5 safeguards · 5 evidence checks</small></button><mark>Evidence incomplete</mark></div><div class="detail" id="program-detail"><section><h3>Why this status</h3><p>Two annual-return evidence sections still need an accountable owner.</p></section><section><h3>Requirements</h3><div class="row"><div><strong>Submit the annual compliance return</strong><p>The bank must complete the annual return with source-linked evidence and internal approval before filing.</p></div><span class="pill">Approved</span></div></section><section><h3>Required evidence</h3><div class="row"><div><strong>Annual return evidence package</strong><p>Every required return section has an owner, authoritative source, review status and approval date.</p></div><span class="pill">Required coverage 100%</span></div></section></div></article>`}
function work(){return header('Meridian Trust Bank','Work','Issues, changes, evidence requests and the sources they rely on.')+`<section class="hero"><div><span class="eyebrow">Regulatory change</span><h2>${record.matter}</h2><p>Update the annual return process, evidence ownership and internal approval date.</p><div class="meta"><span>High priority</span><span>Action in progress</span><span>Due Aug 9</span></div></div><div class="orb"><i></i><i></i><i></i></div></section><article class="panel"><div class="detail"><section><h3>What we know</h3><dl><div><dt>Official source</dt><dd>GAID 2025</dd></div><div><dt>Filing deadline</dt><dd>31 March 2027</dd></div><div><dt>Completed sections</dt><dd>8 of 10</dd></div><div><dt>Internal approval date</dt><dd>1 March 2027</dd></div></dl></section><section><h3>Decision</h3><div class="row"><div><strong>Update the current process</strong><p>Use source-linked owners and an earlier internal approval date.</p></div><span class="pill">Approved</span></div></section><section><h3>Action</h3><div class="row"><div><strong>Complete the annual return evidence checklist</strong><p>Assign the two remaining sections and record the DPCO review date.</p></div><span class="pill">In progress</span></div></section><section><h3>Outcome check</h3><div class="row"><div><strong>All ten return sections have an owner, source and approved review status.</strong><p>Work completion does not close the record until this independent check passes.</p></div><span class="pill">Not checked yet</span></div></section></div></article>`}
function imports(){return header('Meridian Trust Bank','Imports','Bring controlled source material into ClearSight for traceable extraction and human review.','<button class="btn primary">Import document</button>')+`<section class="hero"><div><span class="eyebrow">Governed source intake</span><h2>GAID annual-return notice</h2><p>The original digest, extraction method, source anchors and limitations remain visible throughout review.</p></div><div class="orb"><i></i><i></i><i></i></div></section><article class="panel"><div class="detail"><dl><div><dt>File</dt><dd>gaid-annual-return-notice.docx</dd></div><div><dt>Artifact state</dt><dd>Stored unscanned</dd></div><div><dt>Extraction</dt><dd>DOCX XML v1</dd></div><div><dt>Original hash</dt><dd>c6c882f6…51d8</dd></div></dl><section><h3>Important limitations</h3><p>This is retained reference data. Analysis proposals require human review and do not create a legal interpretation or compliance conclusion.</p></section><section class="proposal"><div class="kicker"><span>Possible requirement · 86% confidence</span><span>Pending review</span></div><h3>Maintain accountable evidence owners</h3><p>The institution must maintain an accountable owner and authoritative source for every required annual-return section.</p><blockquote>The institution must maintain an accountable owner and authoritative source for every required annual-return section.</blockquote><div class="actions"><button class="btn">Reject proposal</button><button class="btn primary">Accept for governed follow-up</button></div></section></div></article>`}
function configure(){return header('Governance configuration','Routing and approvals','Responsibility, approval limits, delegation and escalation rules.')+`<section class="hero"><div><span class="eyebrow">Routing checks</span><h2>No blocking configuration issues</h2><p>All evaluated material routes resolve to an active eligible principal.</p></div><div class="orb"><i></i><i></i><i></i></div></section><section class="grid3"><div class="stat"><span>Active policies</span><strong>1</strong><small>Risk and compliance decision authority v4</small></div><div class="stat"><span>Integrity findings</span><strong>0</strong><small>No blocking routing gaps</small></div><div class="stat"><span>Open setup tasks</span><strong>1</strong><small>Confirm final DPCO review date</small></div></section>`}
function toggle(id){document.getElementById(id)?.classList.toggle('hidden')}
function tour(){const params=new URLSearchParams(location.search);if(params.get('tour')!=='on'){document.getElementById('tour').innerHTML='';return}document.getElementById('tour').innerHTML=`<aside class="guide"><button class="close" onclick="this.parentElement.remove()">×</button><div class="guide-copy"><span class="eyebrow">Executive risk or compliance leader · Step 1 of 4</span><h2>Review priority work</h2><p>Today shows work assigned to you, due dates and data freshness.</p><div class="guide-actions"><button class="btn" onclick="this.closest('.guide').remove()">Dismiss</button><button class="btn primary" onclick="this.closest('.guide').remove()">Open Today</button></div></div></aside>`}
function render(){nav();let view=(location.hash.slice(1).split('/')[0]||'today');document.getElementById('app').innerHTML=({today,programs,work,imports,configure}[view]||today)();tour()}window.addEventListener('hashchange',render);render();
</script>
</body></html>
