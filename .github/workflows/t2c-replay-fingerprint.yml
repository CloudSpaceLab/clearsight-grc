name: T2c replay fingerprint

on:
  push:
    branches:
      - codex/issue-61-sourceaccess-t2c-webhook-events

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-61-sourceaccess-t2c-webhook-events
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - name: Bind provider ID to canonical event content
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor missing in {path}')
              p.write_text(text.replace(old, new, 1))

          replace_once('internal/sourceaccess/contracts_types.go',
          '''\tErrSchemaDrift           = errors.New("source schema drift detected")
          )
          ''',
          '''\tErrSchemaDrift           = errors.New("source schema drift detected")
          \tErrEventConflict         = errors.New("source event conflicts with an accepted event")
          )
          ''')

          replace_once('internal/sourceevent/adapter.go',
          '''const (
          \tproviderConsumer   = "source-webhook-provider-v1"
          \tcheckpointConsumer = "source-webhook-checkpoint-v1"
          )
          ''',
          '''const (
          \tproviderConsumer            = "source-webhook-provider-v1"
          \tproviderFingerprintConsumer = "source-webhook-content-v1"
          \tcheckpointConsumer          = "source-webhook-checkpoint-v1"
          )
          ''')
          replace_once('internal/sourceevent/adapter.go',
          '''\tproviderID := providerInboxEventID(s.connection, binding, event.EventID)
          \tduplicate, err := s.adapter.store.InboxProcessed(ctx, s.connection.TenantID, providerConsumer, providerID)
          ''',
          '''\tproviderID := providerInboxEventID(s.connection, binding, event.EventID)
          \tfingerprintID, err := providerFingerprintInboxEventID(s.connection, binding, event, position)
          \tif err != nil {
          \t\treturn sourceaccess.ChangeCaptureResult{}, err
          \t}
          \tduplicate, err := s.adapter.store.InboxProcessed(ctx, s.connection.TenantID, providerConsumer, providerID)
          ''')
          replace_once('internal/sourceevent/adapter.go',
          '''\tif duplicate {
          \t\treturn sourceaccess.ChangeCaptureResult{Accepted: true, Duplicate: true, Receipt: receipt}, nil
          \t}
          ''',
          '''\tif duplicate {
          \t\tsameEvent, checkErr := s.adapter.store.InboxProcessed(ctx, s.connection.TenantID, providerFingerprintConsumer, fingerprintID)
          \t\tif checkErr != nil {
          \t\t\treturn sourceaccess.ChangeCaptureResult{}, checkErr
          \t\t}
          \t\tif !sameEvent {
          \t\t\treturn sourceaccess.ChangeCaptureResult{}, sourceaccess.ErrEventConflict
          \t\t}
          \t\treturn sourceaccess.ChangeCaptureResult{Accepted: true, Duplicate: true, Receipt: receipt}, nil
          \t}
          ''')
          replace_once('internal/sourceevent/adapter.go',
          '''\tcreated, err := s.adapter.store.RecordInboxWithOutbox(ctx, []runtime.InboxReceipt{{TenantID: s.connection.TenantID, Consumer: providerConsumer, EventID: providerID}, {TenantID: s.connection.TenantID, Consumer: checkpointConsumer, EventID: transitionID}}, runtime.OutboxEvent{ID: outboxID, TenantID: s.connection.TenantID, AggregateType: "SOURCE_BINDING", AggregateID: binding.ID, EventType: "SourceBindingChanged", Payload: outbound, OccurredAt: now}, now)
          ''',
          '''\tcreated, err := s.adapter.store.RecordInboxWithOutbox(ctx, []runtime.InboxReceipt{{TenantID: s.connection.TenantID, Consumer: providerConsumer, EventID: providerID}, {TenantID: s.connection.TenantID, Consumer: providerFingerprintConsumer, EventID: fingerprintID}, {TenantID: s.connection.TenantID, Consumer: checkpointConsumer, EventID: transitionID}}, runtime.OutboxEvent{ID: outboxID, TenantID: s.connection.TenantID, AggregateType: "SOURCE_BINDING", AggregateID: binding.ID, EventType: "SourceBindingChanged", Payload: outbound, OccurredAt: now}, now)
          ''')
          replace_once('internal/sourceevent/adapter.go',
          '''\tvar object map[string]any
          \tif err := decoder.Decode(&object); err != nil {
          \t\treturn nil, sourceaccess.ErrDefinitionInvalid
          \t}
          ''',
          '''\tvar object map[string]any
          \tif err := decoder.Decode(&object); err != nil || object == nil {
          \t\treturn nil, sourceaccess.ErrDefinitionInvalid
          \t}
          ''')
          anchor = '''func providerInboxEventID(connection sourceaccess.Connection, binding sourceaccess.Binding, eventID string) string {
          \thash := sha256.New()
          \t_, _ = fmt.Fprintf(hash, "%s\\x1f%s\\x1f%s\\x1f%s\\x1f%s", connection.TenantID, connection.SourceID, binding.ID, binding.Version, eventID)
          \treturn "source-webhook:" + hex.EncodeToString(hash.Sum(nil))
          }
          '''
          addition = anchor + '''func providerFingerprintInboxEventID(connection sourceaccess.Connection, binding sourceaccess.Binding, event sourceaccess.ChangeEvent, position sourceaccess.CheckpointPosition) (string, error) {
          \tdecoder := json.NewDecoder(bytes.NewReader(event.Payload))
          \tdecoder.UseNumber()
          \tvar object map[string]any
          \tif err := decoder.Decode(&object); err != nil || object == nil {
          \t\treturn "", sourceaccess.ErrDefinitionInvalid
          \t}
          \tvar trailing any
          \tif err := decoder.Decode(&trailing); err != io.EOF {
          \t\treturn "", sourceaccess.ErrDefinitionInvalid
          \t}
          \tcanonical, err := json.Marshal(object)
          \tif err != nil {
          \t\treturn "", sourceaccess.ErrDefinitionInvalid
          \t}
          \thash := sha256.New()
          \t_, _ = fmt.Fprintf(hash, "%s\\x1f%s\\x1f%s\\x1f%s\\x1f%s\\x1f%s\\x1f%s\\x1f%s", connection.TenantID, connection.SourceID, binding.ID, binding.Version, event.EventID, position.Kind, position.Value, canonical)
          \treturn "source-webhook-content:" + hex.EncodeToString(hash.Sum(nil)), nil
          }
          '''
          path = Path('internal/sourceevent/adapter.go')
          text = path.read_text()
          if anchor not in text:
              raise SystemExit('provider inbox helper changed')
          path.write_text(text.replace(anchor, addition, 1))

          replace_once('internal/httpapi/source_event_handlers.go',
          '''\tcase errors.Is(err, sourceaccess.ErrCheckpointConflict):
          \t\thttpx.WriteError(w, http.StatusConflict, "source_event_out_of_order", "Send a source event with a position after the last accepted event, or replay the same event ID.")
          ''',
          '''\tcase errors.Is(err, sourceaccess.ErrEventConflict):
          \t\thttpx.WriteError(w, http.StatusConflict, "source_event_replay_conflict", "This event ID was already accepted with different content. Replay the original event or send a new event ID.")
          \tcase errors.Is(err, sourceaccess.ErrCheckpointConflict):
          \t\thttpx.WriteError(w, http.StatusConflict, "source_event_out_of_order", "Send a source event with a position after the last accepted event, or replay the same event ID.")
          ''')

          replace_once('internal/sourceevent/adapter_test.go',
          '''\tresult, err := s.CaptureChange(ctx, view, binding, replay)
          \tif err != nil || !result.Accepted || !result.Duplicate {
          \t\tt.Fatalf("replay=%#v err=%v", result, err)
          \t}
          ''',
          '''\t_, err := s.CaptureChange(ctx, view, binding, replay)
          \tif !errors.Is(err, sourceaccess.ErrEventConflict) {
          \t\tt.Fatalf("conflicting replay err=%v", err)
          \t}
          ''')
          PY
          gofmt -w internal/sourceaccess internal/sourceevent internal/httpapi
          go test -race ./internal/sourceevent ./internal/sourceaccess ./internal/runtime ./internal/httpapi
          go test -tags postgres ./internal/sourceevent ./internal/sourceaccess ./internal/runtime ./internal/httpapi
          go vet ./...
          git diff --check
          rm .github/workflows/t2c-replay-fingerprint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(sourceevent): bind event IDs to accepted content"
          git push origin HEAD:codex/issue-61-sourceaccess-t2c-webhook-events
