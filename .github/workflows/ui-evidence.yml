name: UI/UX flow review

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-ux-flow-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Playwright review runtime
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate component contracts
        run: |
          npm run typecheck
          npm run check:runtime-truth
          npm test
      - name: Build customer and deterministic evidence applications
        run: |
          npm run build
          npm run build:evidence -- --base=/
      - name: Start local preview
        run: |
          npm run preview:evidence -- --host 127.0.0.1 --port 4173 > /tmp/clearsight-ui-preview.log 2>&1 &
          echo $! > /tmp/clearsight-ui-preview.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/clearsight-ui-preview.log
          exit 1
      - name: Run deterministic UI/UX flow review
        env:
          PAGE_URL: http://127.0.0.1:4173
          UI_EVIDENCE_DIR: ui-evidence
        run: npm run review:ui
      - name: Publish review receipt
        if: always()
        run: |
          if [ -f ui-evidence/review.md ]; then
            cat ui-evidence/review.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Automated UI/UX flow review" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "❌ Review receipt was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload UI/UX review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-ux-flow-review-${{ github.sha }}
          path: |
            web/ui-evidence/*.png
            web/ui-evidence/configuration/*.png
            web/ui-evidence/*.json
            web/ui-evidence/*.md
            web/ui-evidence/flow-logs/*.log
          if-no-files-found: error
          retention-days: 14
      - name: Upload preview log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-ux-preview-log-${{ github.sha }}
          path: /tmp/clearsight-ui-preview.log
          if-no-files-found: ignore
          retention-days: 7
