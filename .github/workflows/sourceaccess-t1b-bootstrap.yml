name: Source-access T1b bootstrap

on:
  push:
    branches:
      - codex/issue-61-sourceaccess-t1b

permissions:
  contents: write

concurrency:
  group: sourceaccess-t1b-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-61-sourceaccess-t1b
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - name: Apply and verify the governed T1b surface
        run: bash scripts/apply-sourceaccess-t1b-bootstrap.sh
