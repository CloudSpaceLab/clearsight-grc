name: One-shot remediation formatter

on:
  push:
    branches:
      - agent/close-issue-11-remediation

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'chore: apply automatic formatting repairs'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/close-issue-11-remediation
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Apply deterministic source repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('web/src/App.tsx')
          text = app.read_text()
          old = '''function initials(value: string) {
            const parts = value.trim().split(/\\s+/).filter(Boolean);
            return (parts.length > 1 ? `${parts[0][0]}${parts[parts.length - 1][0]}` : value.slice(0, 2)).toUpperCase();
          }'''
          new = '''function initials(value: string) {
            const parts = value.trim().split(/\\s+/).filter(Boolean);
            const first = parts.at(0)?.at(0) ?? value.at(0) ?? "";
            const last = parts.length > 1 ? parts.at(-1)?.at(0) ?? "" : value.at(1) ?? "";
            return `${first}${last}`.toUpperCase();
          }'''
          if old not in text:
              raise SystemExit('App initials helper did not match the expected source')
          app.write_text(text.replace(old, new))

          contract = Path('api/openapi.yaml')
          text = contract.read_text()
          text = text.replace('version: 0.8.0', 'version: 0.9.0', 1)
          old_path = '''  /api/v1/bank-journeys:
            get:
              summary: List visible bank reference journeys
              description: Returns connected operating journeys visible to the verified actor. Restricted regulator-response records are omitted unless the actor is allowed.
              parameters:
                - { $ref: '#/components/parameters/Tenant' }
              responses:
                '200': { description: Visible journeys and their current stages }
                '503': { description: Bank journeys are unavailable }
          '''
          new_path = '''  /api/v1/bank-journeys:
            get:
              summary: List visible connected bank journeys
              description: Returns journey projections for the verified actor's tenant. Restricted journeys are omitted unless the actor is explicitly allowed. Client tenant parameters are not trusted.
              responses:
                '200':
                  description: Visible journey projections and actionable record targets
                  content:
                    application/json:
                      schema: { $ref: '#/components/schemas/BankJourneysResponse' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '404': { $ref: '#/components/responses/NotFound' }
                '500': { $ref: '#/components/responses/InternalError' }
                '503': { $ref: '#/components/responses/Unavailable' }
          '''
          if old_path not in text:
              raise SystemExit('OpenAPI bank-journeys path did not match the expected source')
          text = text.replace(old_path, new_path, 1)
          text = text.replace('summary: Current demonstration context', 'summary: Current verified runtime context', 1)
          old_error = '''    Error:
              type: object
              required: [error, message]
              properties:
                error: { type: string }
                message: { type: string }
          '''
          schema_block = '''    Error:
              type: object
              required: [error, message]
              properties:
                error: { type: string }
                message: { type: string }
            BankJourneysResponse:
              type: object
              required: [items, generated_at, sample]
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/BankJourney' }
                generated_at: { type: string, format: date-time }
                sample: { type: boolean }
            BankJourney:
              type: object
              required: [code, title, summary, status, status_label, next_action, owner, action_available, completed_steps, total_steps, steps, source_names, sensitive, sample]
              properties:
                code: { type: string, enum: [NDPA_CONTINUOUS, REGULATORY_CHANGE, AUTHORITY_REQUEST, FINDING_REMEDIATION] }
                title: { type: string }
                summary: { type: string }
                status: { type: string }
                status_label: { type: string }
                next_action: { type: string }
                owner: { type: string }
                owner_principal_id: { type: string }
                program_id: { type: string }
                matter_id: { type: string }
                evidence_request_id: { type: string }
                action_target_type: { type: string, enum: [PROGRAM, MATTER, EVIDENCE_REQUEST] }
                action_target_id: { type: string }
                action_label: { type: string }
                action_available: { type: boolean }
                action_unavailable_reason: { type: string }
                due_at: { type: string, format: date-time }
                completed_steps: { type: integer, minimum: 0 }
                total_steps: { type: integer, minimum: 0 }
                steps:
                  type: array
                  items: { $ref: '#/components/schemas/JourneyStep' }
                source_names: { type: array, items: { type: string } }
                sensitive: { type: boolean }
                sample: { type: boolean }
                updated_at: { type: string, format: date-time }
            JourneyStep:
              type: object
              required: [code, label, complete]
              properties:
                code: { type: string }
                label: { type: string }
                complete: { type: boolean }
          '''
          if old_error not in text:
              raise SystemExit('OpenAPI Error schema did not match the expected source')
          text = text.replace(old_error, schema_block, 1)
          response_anchor = '''    Unprocessable:
              description: The request is valid JSON but violates a domain rule
              content:
                application/json:
                  schema: { $ref: '#/components/schemas/Error' }
          '''
          response_addition = response_anchor + '''    Unauthorized:
              description: Verified identity is missing, invalid or expired
              content:
                application/json:
                  schema: { $ref: '#/components/schemas/Error' }
            InternalError:
              description: The current projection could not be loaded
              content:
                application/json:
                  schema: { $ref: '#/components/schemas/Error' }
            Unavailable:
              description: The required service is unavailable
              content:
                application/json:
                  schema: { $ref: '#/components/schemas/Error' }
          '''
          if response_anchor not in text:
              raise SystemExit('OpenAPI response anchor did not match the expected source')
          contract.write_text(text.replace(response_anchor, response_addition, 1))
          PY
          gofmt -w $(find cmd internal -name '*.go' -type f)
      - name: Commit repairs
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'ClearSight CI Formatter'
          git config user.email 'actions@users.noreply.github.com'
          git add cmd internal web/src/App.tsx api/openapi.yaml
          git commit -m 'chore: apply automatic formatting repairs'
          git push origin HEAD:agent/close-issue-11-remediation
