name: Source-access T1 completion closeout

on:
  push:
    branches:
      - codex/issue-61-sourceaccess-t1c

permissions:
  contents: write

concurrency:
  group: sourceaccess-t1c-closeout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: clearsight
          POSTGRES_USER: clearsight
          POSTGRES_PASSWORD: clearsight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clearsight -d clearsight"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-61-sourceaccess-t1c
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Complete and publish T1 runtime state
        env:
          PGPASSWORD: clearsight
          TEST_DATABASE_URL: postgres://clearsight:clearsight@localhost:5432/clearsight?sslmode=disable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-sourceaccess-t1c-closeout.sh")
          text = path.read_text()
          start = text.index("# 9. Make the T1c migration")
          end = text.index("# 10. Promote the tranche verifier", start)
          text = text[:start] + text[end:]
          text = text.replace(
              "rm -f .github/workflows/sourceaccess-t1c-closeout.yml scripts/apply-sourceaccess-t1c-closeout.sh",
              "rm -f scripts/apply-sourceaccess-t1c-closeout.sh",
          )
          path.write_text(text)
          PY
          bash scripts/apply-sourceaccess-t1c-closeout.sh
