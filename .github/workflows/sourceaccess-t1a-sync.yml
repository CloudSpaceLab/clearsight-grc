name: Synchronize T1a with verified T0

on:
  push:
    branches:
      - codex/issue-61-sourceaccess-t1a

permissions:
  contents: write

concurrency:
  group: synchronize-sourceaccess-t1a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-61-sourceaccess-t1a
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - name: Merge verified T0 and retain T1a
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff origin/main -m "merge(sourceaccess): synchronize T1a with verified T0"
          go test ./internal/sourceaccess ./internal/evidence
          go test -tags postgres ./internal/sourceaccess ./internal/evidence
          rm .github/workflows/sourceaccess-t1a-sync.yml
          git add -u
          git commit --amend --no-edit
          git push origin HEAD:codex/issue-61-sourceaccess-t1a
