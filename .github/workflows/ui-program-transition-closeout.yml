name: UI Program transition closeout

on:
  push:
    branches:
      - codex/issue-61-sourceaccess-t0

permissions:
  contents: write

concurrency:
  group: ui-program-transition-closeout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-61-sourceaccess-t0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Close the Program transition flow
        run: bash scripts/apply-ui-program-transition-closeout.sh
