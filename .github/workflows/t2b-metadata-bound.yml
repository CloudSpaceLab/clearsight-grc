name: T2b tabular metadata bound

on:
  push:
    branches:
      - codex/issue-61-sourceaccess-t2b-tabular-artifacts

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-61-sourceaccess-t2b-tabular-artifacts
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - name: Align parser and persistence metadata budgets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('internal/documentimport/tabular.go')
          text = path.read_text()
          text = text.replace(
              'const TabularParserVersion = "TABULAR_V1"\n',
              'const (\n\tTabularParserVersion         = "TABULAR_V1"\n\tHardMaxTabularMetadataBytes = 2 << 20\n)\n',
              1,
          )
          old = '''\tmetadata := state.metadata()
          \tif err != nil && !errors.Is(err, errTabularStop) {
          \t\tmetadata.FatalError = truncateUTF8(err.Error(), 1024)
          \t}
          \treturn metadata, err
          }
          '''
          new = '''\tmetadata := state.metadata()
          \tif !errors.Is(err, errTabularStop) {
          \t\tbounded, metadataErr := boundTabularMetadata(metadata)
          \t\tmetadata = bounded
          \t\tif metadataErr != nil && err == nil {
          \t\t\terr = metadataErr
          \t\t}
          \t}
          \tif err != nil && !errors.Is(err, errTabularStop) && metadata.FatalError == "" {
          \t\tmetadata.FatalError = truncateUTF8(err.Error(), 1024)
          \t}
          \treturn metadata, err
          }

          func boundTabularMetadata(metadata TabularMetadata) (TabularMetadata, error) {
          \tencoded, err := json.Marshal(metadata)
          \tif err != nil {
          \t\tcompact := TabularMetadata{Format: metadata.Format, ParserVersion: metadata.ParserVersion, RowsTotal: metadata.RowsTotal, RowsRejected: metadata.RowsRejected, FatalError: "tabular parser metadata could not be encoded"}
          \t\treturn compact, fmt.Errorf("tabular parser metadata could not be encoded: %w", err)
          \t}
          \tif len(encoded) <= HardMaxTabularMetadataBytes {
          \t\treturn metadata, nil
          \t}
          \tmessage := fmt.Sprintf("tabular parser metadata exceeds %d bytes", HardMaxTabularMetadataBytes)
          \tcompact := TabularMetadata{
          \t\tFormat: metadata.Format, ParserVersion: metadata.ParserVersion,
          \t\tRowsTotal: metadata.RowsTotal, RowsRejected: metadata.RowsRejected,
          \t\tRowErrors: append([]TabularRowError(nil), metadata.RowErrors...), FatalError: message,
          \t}
          \tcompactEncoded, compactErr := json.Marshal(compact)
          \tif compactErr != nil || len(compactEncoded) > HardMaxTabularMetadataBytes {
          \t\tcompact.RowErrors = nil
          \t}
          \treturn compact, limitError("%s", message)
          }
          '''
          if old not in text:
              raise SystemExit('tabular metadata return block changed')
          path.write_text(text.replace(old, new, 1))

          path = Path('migrations/000032_document_import_tabular_metadata.up.sql')
          text = path.read_text()
          if '262144' not in text:
              raise SystemExit('migration metadata bound changed')
          path.write_text(text.replace('262144', '2097152', 1))

          path = Path('internal/documentimport/tabular_test.go')
          text = path.read_text()
          if '"strings"' not in text:
              text = text.replace('\t"context"\n', '\t"context"\n\t"errors"\n\t"fmt"\n\t"strings"\n', 1)
          addition = '''
          func TestTabularMetadataBudgetFailsCompactly(t *testing.T) {
          \tfields := make([]TabularField, 0, 10000)
          \tfor index := 0; index < 10000; index++ {
          \t\tfields = append(fields, TabularField{Name: fmt.Sprintf("field_%05d_%s", index, strings.Repeat("x", 240)), NativeType: "tabular:string"})
          \t}
          \tmetadata, err := boundTabularMetadata(TabularMetadata{Format: TabularXLSX, ParserVersion: TabularParserVersion, Resources: []TabularResource{{Name: "Sheet 1", Fields: fields}}})
          \tif !errors.Is(err, ErrResourceLimit) || metadata.FatalError == "" || len(metadata.Resources) != 0 {
          \t\tt.Fatalf("oversized tabular metadata was not compactly bounded: metadata=%#v err=%v", metadata, err)
          \t}
          \tencoded, marshalErr := json.Marshal(metadata)
          \tif marshalErr != nil || len(encoded) > HardMaxTabularMetadataBytes {
          \t\tt.Fatalf("compact failure receipt exceeded the persistence budget: bytes=%d err=%v", len(encoded), marshalErr)
          \t}
          }
          '''
          text += addition
          path.write_text(text)

          path = Path('docs/architecture/connected-source-access.md')
          text = path.read_text()
          old = '`document_imports.tabular_metadata` retains only bounded parser provenance: format/parser version, row totals and rejections, bounded row diagnostics, resource schemas and schema fingerprints.'
          new = '`document_imports.tabular_metadata` retains only bounded parser provenance: format/parser version, row totals and rejections, bounded row diagnostics, resource schemas and schema fingerprints. The parser and PostgreSQL share a 2 MiB metadata ceiling; artifacts whose derived schema would exceed it remain preserved for governed review but are not executable as tabular Source Access until reduced or re-governed.'
          if old not in text:
              raise SystemExit('T2b metadata documentation changed')
          path.write_text(text.replace(old, new, 1))
          PY
          gofmt -w internal/documentimport/tabular.go internal/documentimport/tabular_test.go
          go test -race ./internal/documentimport ./internal/sourceaccess
          go test -tags postgres ./internal/documentimport ./internal/sourceaccess
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/documentimport/tabular.go internal/documentimport/tabular_test.go migrations/000032_document_import_tabular_metadata.up.sql docs/architecture/connected-source-access.md
          git commit -m "fix(documentimport): bound tabular parser metadata"
          git push origin HEAD:codex/issue-61-sourceaccess-t2b-tabular-artifacts
