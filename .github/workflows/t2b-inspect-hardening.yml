name: T2b tabular inspect hardening

on:
  push:
    branches:
      - codex/issue-61-sourceaccess-t2b-tabular-artifacts

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-61-sourceaccess-t2b-tabular-artifacts
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - name: Verify artifact bytes before inspection
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('internal/documentimport/sourceaccess_adapter.go')
          text = path.read_text()
          old = '''\tdocument, resource, _, err := s.resolve(ctx, view)
          \tif err != nil {
          \t\treturn sourceaccess.SchemaResult{}, err
          \t}
          \tfields := make([]sourceaccess.NativeField, 0, len(resource.Fields))
          '''
          new = '''\tdocument, resource, _, err := s.resolve(ctx, view)
          \tif err != nil {
          \t\treturn sourceaccess.SchemaResult{}, err
          \t}
          \t// Schema provenance is valid only for the exact preserved artifact. Read
          \t// and verify size/digest before trusting the stored parser receipt.
          \tif _, err := s.readArtifact(ctx, document); err != nil {
          \t\treturn sourceaccess.SchemaResult{}, err
          \t}
          \tfields := make([]sourceaccess.NativeField, 0, len(resource.Fields))
          '''
          if old not in text:
              raise SystemExit('Inspect artifact verification insertion point changed')
          path.write_text(text.replace(old, new, 1))

          path = Path('internal/documentimport/sourceaccess_adapter_test.go')
          text = path.read_text()
          old = '''\tif _, err := store.Put(ctx, document.StorageKey, strings.NewReader("id,name\\n1,Mallory\\n"), 1<<20); err != nil {
          \t\tt.Fatal(err)
          \t}
          \tif _, err := session.(sourceaccess.PageReader).ReadPage(ctx, view, binding, sourceaccess.PageRequest{}); !errors.Is(err, sourceaccess.ErrExecution) {
          \t\tt.Fatalf("changed artifact was accepted: %v", err)
          \t}
          '''
          new = '''\tif _, err := store.Put(ctx, document.StorageKey, strings.NewReader("id,name\\n1,Mallory\\n"), 1<<20); err != nil {
          \t\tt.Fatal(err)
          \t}
          \tif _, err := session.(sourceaccess.SchemaReader).Inspect(ctx, view); !errors.Is(err, sourceaccess.ErrExecution) {
          \t\tt.Fatalf("changed artifact remained inspectable: %v", err)
          \t}
          \tif _, err := session.(sourceaccess.PageReader).ReadPage(ctx, view, binding, sourceaccess.PageRequest{}); !errors.Is(err, sourceaccess.ErrExecution) {
          \t\tt.Fatalf("changed artifact was accepted: %v", err)
          \t}
          '''
          if old not in text:
              raise SystemExit('changed artifact test block changed')
          path.write_text(text.replace(old, new, 1))
          PY
          gofmt -w internal/documentimport/sourceaccess_adapter.go internal/documentimport/sourceaccess_adapter_test.go
          go test -race ./internal/documentimport ./internal/sourceaccess
          go test -tags postgres ./internal/documentimport ./internal/sourceaccess
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/documentimport/sourceaccess_adapter.go internal/documentimport/sourceaccess_adapter_test.go
          git commit -m "fix(sourceaccess): verify tabular artifact on inspect"
          git push origin HEAD:codex/issue-61-sourceaccess-t2b-tabular-artifacts
