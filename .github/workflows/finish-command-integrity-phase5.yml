name: Finish command integrity phase 5

on:
  push:
    branches:
      - agent/command-integrity-phase-5

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: clearsight
          POSTGRES_USER: clearsight
          POSTGRES_PASSWORD: clearsight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clearsight -d clearsight"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://clearsight:clearsight@localhost:5432/clearsight?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/command-integrity-phase-5
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply reviewed Phase 5 changes
        run: |
          python scripts/apply_phase5_integrity.py
          python scripts/patch_phase5_trigger_actor.py
          python scripts/finish_phase5.py
          python scripts/patch_phase5_postgres.py
          python scripts/finish_phase5_ui.py
          python scripts/patch_phase5_integration.py
          python scripts/patch_phase5_docs.py
          gofmt -w cmd internal
      - name: Validate backend
        run: |
          go mod download
          test -z "$(gofmt -l $(find cmd internal -name '*.go' -type f))"
          go test -race ./...
          go test -tags postgres ./...
          go vet ./...
      - name: Apply migrations
        env:
          PGPASSWORD: clearsight
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          for migration in migrations/*.up.sql; do
            psql -h localhost -U clearsight -d clearsight -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: PostgreSQL integration tests
        run: go test -tags "postgres postgresintegration" ./internal/integration
      - name: Validate web
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Commit validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows/finish-command-integrity-phase5.yml' ':!scripts/apply_phase5_integrity.py' ':!scripts/patch_phase5_trigger_actor.py' ':!scripts/finish_phase5.py' ':!scripts/patch_phase5_postgres.py' ':!scripts/finish_phase5_ui.py' ':!scripts/patch_phase5_integration.py' ':!scripts/patch_phase5_docs.py'
          git commit -m 'feat: enforce command integrity and operate Program status updates'
          git push origin HEAD:agent/command-integrity-phase-5
