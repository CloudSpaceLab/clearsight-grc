name: T2c webhook hardening

on:
  push:
    branches:
      - codex/issue-61-sourceaccess-t2c-webhook-events

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: clearsight
          POSTGRES_USER: clearsight
          POSTGRES_PASSWORD: clearsight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clearsight -d clearsight"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PGPASSWORD: clearsight
      TEST_DATABASE_URL: postgres://clearsight:clearsight@localhost:5432/clearsight?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-61-sourceaccess-t2c-webhook-events
          fetch-depth: 0
      - name: Merge current main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.6.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Apply T2c hardening
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor missing in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Secondary checkpoint-proof collisions are typed and roll back the provider receipt/outbox.
          replace_once('internal/runtime/postgres.go', '''\tfor _, receipt := range receipts[1:] {
          \t\tif receipt.TenantID != event.TenantID {
          \t\t\treturn false, errors.New("inbox receipt does not match outbox tenant")
          \t\t}
          \t\tif _, err := tx.Exec(ctx, `INSERT INTO inbox_receipts(tenant_id,consumer,event_id,processed_at) VALUES((SELECT id FROM tenants WHERE id::text=$1 OR slug=$1),$2,$3,$4)`, receipt.TenantID, receipt.Consumer, receipt.EventID, at); err != nil {
          \t\t\treturn false, err
          \t\t}
          \t}
          ''', '''\tfor _, receipt := range receipts[1:] {
          \t\tif receipt.TenantID != event.TenantID {
          \t\t\treturn false, errors.New("inbox receipt does not match outbox tenant")
          \t\t}
          \t\ttag, err := tx.Exec(ctx, `INSERT INTO inbox_receipts(tenant_id,consumer,event_id,processed_at) VALUES((SELECT id FROM tenants WHERE id::text=$1 OR slug=$1),$2,$3,$4) ON CONFLICT DO NOTHING`, receipt.TenantID, receipt.Consumer, receipt.EventID, at)
          \t\tif err != nil {
          \t\t\treturn false, err
          \t\t}
          \t\tif tag.RowsAffected() == 0 {
          \t\t\treturn false, ErrInboxReceiptConflict
          \t\t}
          \t}
          ''')

          # Once the atomic provider-receipt/outbox transaction commits, projection failures are recoverable and cannot turn acceptance into an HTTP failure.
          replace_once('internal/sourceevent/adapter.go', '''\tif duplicate {
          \t\tif err := s.reconcileDuplicate(ctx, checkpoint, definition.PositionKind, position, now); err != nil {
          \t\t\treturn sourceaccess.ChangeCaptureResult{}, err
          \t\t}
          \t\treturn sourceaccess.ChangeCaptureResult{Accepted: true, Duplicate: true, Receipt: receipt}, nil
          \t}
          ''', '''\tif duplicate {
          \t\t_ = s.reconcileDuplicate(ctx, checkpoint, definition.PositionKind, position, now)
          \t\treturn sourceaccess.ChangeCaptureResult{Accepted: true, Duplicate: true, Receipt: receipt}, nil
          \t}
          ''')
          replace_once('internal/sourceevent/adapter.go', '''\tcreated, err := s.adapter.store.RecordInboxWithOutbox(ctx, []runtime.InboxReceipt{{TenantID: s.connection.TenantID, Consumer: providerConsumer, EventID: providerID}, {TenantID: s.connection.TenantID, Consumer: checkpointConsumer, EventID: transitionID}}, runtime.OutboxEvent{ID: outboxID, TenantID: s.connection.TenantID, AggregateType: "SOURCE_BINDING", AggregateID: binding.ID, EventType: "SourceBindingChanged", Payload: outbound, OccurredAt: now}, now)
          \tif err != nil {
          \t\treturn sourceaccess.ChangeCaptureResult{}, err
          \t}
          \tif !created {
          \t\tcheckpoint, getErr := s.adapter.checkpoints.Get(ctx, s.connection.TenantID, binding.ID, bindingVersion)
          \t\tif getErr != nil {
          \t\t\treturn sourceaccess.ChangeCaptureResult{}, getErr
          \t\t}
          \t\tif err := s.reconcileDuplicate(ctx, checkpoint, definition.PositionKind, position, now); err != nil {
          \t\t\treturn sourceaccess.ChangeCaptureResult{}, err
          \t\t}
          \t\treturn sourceaccess.ChangeCaptureResult{Accepted: true, Duplicate: true, Receipt: receipt}, nil
          \t}
          \tif err := s.advanceAccepted(ctx, checkpoint, definition.PositionKind, position, now); err != nil {
          \t\treturn sourceaccess.ChangeCaptureResult{}, err
          \t}
          \treturn sourceaccess.ChangeCaptureResult{Accepted: true, Receipt: receipt}, nil
          ''', '''\tcreated, err := s.adapter.store.RecordInboxWithOutbox(ctx, []runtime.InboxReceipt{{TenantID: s.connection.TenantID, Consumer: providerConsumer, EventID: providerID}, {TenantID: s.connection.TenantID, Consumer: checkpointConsumer, EventID: transitionID}}, runtime.OutboxEvent{ID: outboxID, TenantID: s.connection.TenantID, AggregateType: "SOURCE_BINDING", AggregateID: binding.ID, EventType: "SourceBindingChanged", Payload: outbound, OccurredAt: now}, now)
          \tif err != nil {
          \t\tif errors.Is(err, runtime.ErrInboxReceiptConflict) {
          \t\t\treturn sourceaccess.ChangeCaptureResult{}, sourceaccess.ErrCheckpointConflict
          \t\t}
          \t\treturn sourceaccess.ChangeCaptureResult{}, err
          \t}
          \tif !created {
          \t\tif current, getErr := s.adapter.checkpoints.Get(ctx, s.connection.TenantID, binding.ID, bindingVersion); getErr == nil {
          \t\t\t_ = s.reconcileDuplicate(ctx, current, definition.PositionKind, position, now)
          \t\t}
          \t\treturn sourceaccess.ChangeCaptureResult{Accepted: true, Duplicate: true, Receipt: receipt}, nil
          \t}
          \t_ = s.advanceAccepted(ctx, checkpoint, definition.PositionKind, position, now)
          \treturn sourceaccess.ChangeCaptureResult{Accepted: true, Receipt: receipt}, nil
          ''')
          replace_once('internal/sourceevent/adapter.go', '''\tcase "json:string":
          \t\ttyped, ok := value.(string)
          \t\tif !ok || len(typed) > 64<<10 {
          ''', '''\tcase "json:string":
          \t\ttyped, ok := value.(string)
          \t\tif !ok || len(typed) > 64<<10 || strings.IndexByte(typed, 0) >= 0 {
          ''')

          # Retryable outbox projection is the durable checkpoint recovery path.
          replace_once('internal/sourceevent/projector.go', '''import (
          \t"context"
          ''', '''import (
          \t"context"
          \t"errors"
          ''')
          replace_once('internal/sourceevent/projector.go', '''\t\tif err == sourceaccess.ErrCheckpointConflict {
          \t\t\treturn nil
          \t\t}
          ''', '''\t\tif errors.Is(err, sourceaccess.ErrCheckpointConflict) {
          \t\t\treturn nil
          \t\t}
          ''')

          # Production outbox delivery cannot mark SourceBindingChanged published until its checkpoint projection converges.
          replace_once('cmd/worker/services_postgres.go', '''\t"github.com/CloudSpaceLab/clearsight-grc/internal/reconciliation"
          \tworkflowruntime "github.com/CloudSpaceLab/clearsight-grc/internal/runtime"
          \t"github.com/CloudSpaceLab/clearsight-grc/internal/workflow"
          ''', '''\t"github.com/CloudSpaceLab/clearsight-grc/internal/reconciliation"
          \tworkflowruntime "github.com/CloudSpaceLab/clearsight-grc/internal/runtime"
          \t"github.com/CloudSpaceLab/clearsight-grc/internal/sourceaccess"
          \t"github.com/CloudSpaceLab/clearsight-grc/internal/sourceevent"
          \t"github.com/CloudSpaceLab/clearsight-grc/internal/workflow"
          ''')
          replace_once('cmd/worker/services_postgres.go', '''\truntimeRepository := workflowruntime.NewPostgresRepository(pool)
          \tlifecycle := governance.NewPostgresRepository(pool)
          ''', '''\truntimeRepository := workflowruntime.NewPostgresRepository(pool)
          \tsourceCheckpoints := sourceaccess.NewCheckpointService(sourceaccess.NewPostgresCheckpointRepository(pool), runtimeRepository)
          \tsourceEventCheckpoint := sourceevent.NewCheckpointProjector(runtimeRepository, sourceCheckpoints)
          \tlifecycle := governance.NewPostgresRepository(pool)
          ''')
          replace_once('cmd/worker/services_postgres.go', '''\tpublisher := workflowruntime.NewCompositePublisher(sourceHealth, actionWork, lifecycleWork, escalationWork, documentService, coverageService, workflowruntime.LogPublisher{Logger: logger})
          ''', '''\tpublisher := workflowruntime.NewCompositePublisher(sourceEventCheckpoint, sourceHealth, actionWork, lifecycleWork, escalationWork, documentService, coverageService, workflowruntime.LogPublisher{Logger: logger})
          ''')

          # T2c is part of the mechanically checked source-access acceptance chain.
          replace_once('scripts/verify-sourceaccess-tranche.sh', '''if [[ "$tranche" == "auto" ]]; then
            if [[ -f internal/documentimport/sourceaccess_adapter.go && -f migrations/000032_document_import_tabular_metadata.up.sql ]]; then
              tranche="t2b"
          ''', '''if [[ "$tranche" == "auto" ]]; then
            if [[ -f internal/sourceevent/adapter.go && -f internal/sourceevent/projector.go ]]; then
              tranche="t2c"
            elif [[ -f internal/documentimport/sourceaccess_adapter.go && -f migrations/000032_document_import_tabular_metadata.up.sql ]]; then
              tranche="t2b"
          ''')
          replace_once('scripts/verify-sourceaccess-tranche.sh', '''if [[ "$tranche" != "t0" && "$tranche" != "t1a" && "$tranche" != "t1b" && "$tranche" != "t1c" && "$tranche" != "t2a" && "$tranche" != "t2b" ]]; then
            echo "usage: $0 [auto|t0|t1a|t1b|t1c|t2a|t2b]" >&2
          ''', '''if [[ "$tranche" != "t0" && "$tranche" != "t1a" && "$tranche" != "t1b" && "$tranche" != "t1c" && "$tranche" != "t2a" && "$tranche" != "t2b" && "$tranche" != "t2c" ]]; then
            echo "usage: $0 [auto|t0|t1a|t1b|t1c|t2a|t2b|t2c]" >&2
          ''')
          replace_once('scripts/verify-sourceaccess-tranche.sh', '''\t  if [[ "$tranche" == "t2a" || "$tranche" == "t2b" ]]; then
          ''', '''\t  if [[ "$tranche" == "t2a" || "$tranche" == "t2b" || "$tranche" == "t2c" ]]; then
          ''')
          replace_once('scripts/verify-sourceaccess-tranche.sh', '''\t    if [[ "$tranche" == "t2b" ]]; then
          ''', '''\t    if [[ "$tranche" == "t2b" || "$tranche" == "t2c" ]]; then
          ''')
          replace_once('scripts/verify-sourceaccess-tranche.sh', '''\t      summary="T2b governed tabular capture passed: CSV/JSON/NDJSON/XLSX originals, bounded parser receipts, row diagnostics/schema fingerprints and reusable artifact-backed inspect/page/lookup without a source-row table."
          \t    fi
          \t  fi
          ''', '''\t      summary="T2b governed tabular capture passed: CSV/JSON/NDJSON/XLSX originals, bounded parser receipts, row diagnostics/schema fingerprints and reusable artifact-backed inspect/page/lookup without a source-row table."
          \t    fi
          \t    if [[ "$tranche" == "t2c" ]]; then
          \t      required_t2c=(
          \t        internal/sourceevent/adapter.go
          \t        internal/sourceevent/adapter_test.go
          \t        internal/sourceevent/projector.go
          \t        internal/sourceevent/projector_test.go
          \t        internal/sourceaccess/webhook_event_definition.go
          \t        internal/sourceaccess/catalog_changes.go
          \t        internal/httpapi/source_event_handlers.go
          \t        internal/httpapi/source_event_handlers_test.go
          \t        internal/runtime/inbox_outbox_postgres_integration_test.go
          \t      )
          \t      for file in "${required_t2c[@]}"; do
          \t        test -s "$file" || { echo "missing T2c contract: $file" >&2; exit 1; }
          \t      done
          \t      grep -q 'AdapterWebhookEvent' internal/sourceaccess/contracts_types.go || { echo "webhook event adapter kind is missing" >&2; exit 1; }
          \t      grep -q 'RecordInboxWithOutbox' internal/runtime/repository.go || { echo "atomic inbound receipt/outbox primitive is missing" >&2; exit 1; }
          \t      grep -q 'actor.Kind != "SERVICE"' internal/httpapi/source_event_handlers.go || { echo "source event ingress is not service-identity-only" >&2; exit 1; }
          \t      grep -q '/api/v1/source-bindings/{id}/events' api/runtime.openapi.json || { echo "source event route is missing from runtime contract" >&2; exit 1; }
          \t      grep -q 'NewCheckpointProjector' cmd/worker/services_postgres.go || { echo "source event checkpoint recovery is not wired into outbox delivery" >&2; exit 1; }
          \t      if grep -R -nE --include='*.go' --exclude='*_test.go' 'internal/(runtime|sourceevent)' internal/sourceaccess; then
          \t        echo "sourceaccess production code depends on runtime/sourceevent" >&2
          \t        exit 1
          \t      fi
          \t      if compgen -G 'migrations/000033*' >/dev/null; then
          \t        echo "T2c webhook/event capture must not introduce an adapter/event table" >&2
          \t        exit 1
          \t      fi
          \t      go test ./internal/sourceevent ./internal/sourceaccess ./internal/runtime ./internal/httpapi ./cmd/api ./cmd/worker
          \t      go test -tags postgres ./internal/sourceevent ./internal/sourceaccess ./internal/runtime ./internal/httpapi ./cmd/api ./cmd/worker
          \t      summary="T2c webhook/event capture passed: service-only bounded CHANGES ingress, atomic provider-event dedupe and outbox durability, strict event/watermark positions, and retrying inbox-backed Binding checkpoint convergence without a webhook table or second event bus."
          \t    fi
          \t  fi
          ''')

          # Architecture receipt.
          path = Path('docs/architecture/connected-source-access.md')
          text = path.read_text()
          marker = '## Current limitations\n'
          section = '''## Webhook/event adapter — T2c

          `WEBHOOK_EVENT` is a push-only `CHANGES` capability. Event delivery uses the existing verified service-principal and material-command boundary; tenant scope is taken only from verified identity and is not accepted from the request body. A governed View declares a fixed scalar JSON schema and either `EVENT_ID` or canonical unsigned `WATERMARK` position semantics.

          Acceptance commits a stable provider-event inbox receipt, the exact checkpoint-transition proof and an existing runtime outbox event atomically. The outbox carries only Binding-selected canonical fields plus compact source/version/position provenance, not an independent copy of the raw webhook body. A retrying `SourceBindingChanged` projector runs in the existing outbox worker before publication is acknowledged, so a checkpoint write failure after acceptance is recovered without asking the provider to recreate the command.

          `EVENT_ID` is idempotency identity rather than an ordering primitive and an old replay cannot regress a newer checkpoint. `WATERMARK` positions must be canonical monotonically increasing unsigned integers; stale positions fail before acceptance and concurrent same-position events resolve as a checkpoint conflict. No webhook registry, webhook payload table, connector-specific scheduler, queue or event bus is added.

          '''
          if marker not in text:
              raise SystemExit('connected-source current limitations heading missing')
          if '## Webhook/event adapter — T2c' not in text:
              text = text.replace(marker, section + marker, 1)
          text = text.replace('- PostgreSQL, REST/JSON and governed tabular artifacts are executable adapters; webhook/event capture remains T2 work.', '- PostgreSQL, REST/JSON, governed tabular artifacts and webhook/event capture are executable adapters.')
          text = text.replace('- Webhook/event and non-PostgreSQL database adapters are not implemented.', '- Non-PostgreSQL database and broker-specific streaming adapters are not implemented.')
          path.write_text(text)

          # The source-event request decoder is strict; return task-focused copy rather than raw decoder internals.
          replace_once('internal/httpapi/source_event_handlers.go', '''\tif err := httpx.DecodeJSON(w, r, &input); err != nil {
          \t\thttpx.WriteError(w, http.StatusBadRequest, "invalid_request", err.Error())
          \t\treturn
          \t}
          ''', '''\tif err := httpx.DecodeJSON(w, r, &input); err != nil {
          \t\thttpx.WriteError(w, http.StatusBadRequest, "invalid_request", "Send one source event with event_id, optional position and payload fields only.")
          \t\treturn
          \t}
          ''')
          PY

          gofmt -w internal/sourceaccess internal/sourceevent internal/runtime internal/httpapi cmd/api cmd/worker
          git diff --check

          go test -race ./internal/sourceaccess ./internal/sourceevent ./internal/runtime ./internal/httpapi ./cmd/api ./cmd/worker
          go test -tags postgres ./internal/sourceaccess ./internal/sourceevent ./internal/runtime ./internal/httpapi ./cmd/api ./cmd/worker

          for migration in migrations/*.up.sql; do
            psql -X "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done
          bash scripts/verify-sourceaccess-tranche.sh t2c
          go test -p 1 -tags "postgres postgresintegration" ./internal/runtime ./internal/sourceaccess ./internal/sourceevent
          go vet ./...

          cd web
          npm ci --no-audit --no-fund
          npm test -- src/copyQuality.test.ts
          cd ..

          rm .github/workflows/t2c-hardening.yml
          git add -A
          git commit -m "fix(sourceaccess): harden T2c webhook recovery"
          git push origin HEAD:codex/issue-61-sourceaccess-t2c-webhook-events
