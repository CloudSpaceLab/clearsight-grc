name: Snapshot T5 rebase source
on:
  push:
    branches: [agent/t5-current-main-snapshot]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Package exact source tree
        run: tar --exclude=.git -czf /tmp/clearsight-current-main.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: clearsight-current-main-${{ github.sha }}
          path: /tmp/clearsight-current-main.tgz
          if-no-files-found: error
          retention-days: 1
