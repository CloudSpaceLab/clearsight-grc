name: T2b tabular adapter wiring

on:
  push:
    branches:
      - codex/issue-61-sourceaccess-t2b-tabular-artifacts

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-61-sourceaccess-t2b-tabular-artifacts
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - name: Wire shared contracts and runtime composition
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(pathname, old, new, label):
              path = Path(pathname)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'{label} changed')
              path.write_text(text.replace(old, new, 1))

          replace('internal/sourceaccess/contracts_types.go',
              'const (\n\tAdapterPostgres AdapterKind = "POSTGRES"\n\tAdapterRESTJSON AdapterKind = "REST_JSON"\n)',
              'const (\n\tAdapterPostgres        AdapterKind = "POSTGRES"\n\tAdapterRESTJSON        AdapterKind = "REST_JSON"\n\tAdapterTabularArtifact AdapterKind = "TABULAR_ARTIFACT"\n)\n\nconst TabularArtifactAdapterVersion = "tabular-artifact-v1"',
              'adapter kinds')
          replace('internal/sourceaccess/contracts_types.go',
              'type Connection struct {\n\tID             string',
              'type Connection struct {\n\tTenantID       string          `json:"tenant_id,omitempty"`\n\tID             string',
              'connection tenant scope')
          replace('internal/sourceaccess/contracts_types.go',
              '\tRetryIdentity         string              `json:"retry_identity,omitempty"`\n',
              '\tRetryIdentity         string              `json:"retry_identity,omitempty"`\n\tArtifactID            string              `json:"artifact_id,omitempty"`\n\tArtifactSHA256        string              `json:"artifact_sha256,omitempty"`\n\tParserVersion         string              `json:"parser_version,omitempty"`\n',
              'receipt artifact provenance')

          replace('internal/sourceaccess/contracts_validation.go',
              'func (c Connection) Validate() error {\n\tif err := validateOpaqueID(c.ID, "connection id"); err != nil {',
              'func (c Connection) Validate() error {\n\tif c.TenantID != "" {\n\t\tif err := validateOpaqueID(c.TenantID, "tenant id"); err != nil {\n\t\t\treturn err\n\t\t}\n\t}\n\tif err := validateOpaqueID(c.ID, "connection id"); err != nil {',
              'connection validation')

          replace('internal/sourceaccess/catalog_types.go',
              '\treturn Connection{\n\t\tID:             value.ConnectionID,',
              '\treturn Connection{\n\t\tTenantID:       value.TenantID,\n\t\tID:             value.ConnectionID,',
              'catalog connection contract')

          replace('internal/sourceaccess/catalog_service.go',
              '''\tcase AdapterRESTJSON:
          \t\tif _, err := normalizeRESTJSONConnectionDefinition(defaultJSONObject(input.Definition), strings.TrimSpace(input.SecretRef)); err != nil {
          \t\t\treturn errors.Join(ErrCatalogInvalid, err)
          \t\t}
          \t}
          ''',
              '''\tcase AdapterRESTJSON:
          \t\tif _, err := normalizeRESTJSONConnectionDefinition(defaultJSONObject(input.Definition), strings.TrimSpace(input.SecretRef)); err != nil {
          \t\t\treturn errors.Join(ErrCatalogInvalid, err)
          \t\t}
          \tcase AdapterTabularArtifact:
          \t\tif input.SecretRef != "" {
          \t\t\treturn fmt.Errorf("%w: tabular artifact connections do not carry credentials", ErrCatalogInvalid)
          \t\t}
          \t\tdefinition, err := normalizeJSONObject(defaultJSONObject(input.Definition), HardMaxDefinitionBytes, "connection definition")
          \t\tif err != nil {
          \t\t\treturn err
          \t\t}
          \t\tif string(definition) != "{}" {
          \t\t\treturn fmt.Errorf("%w: tabular artifact connection definitions are not supported", ErrCatalogInvalid)
          \t\t}
          \t}
          ''', 'tabular connection validation')
          replace('internal/sourceaccess/catalog_service.go',
              '''\tcase AdapterRESTJSON:
          \t\tif version != RESTJSONAdapterVersion {
          \t\t\treturn nil, fmt.Errorf("%w: unsupported REST/JSON adapter version", ErrCatalogInvalid)
          \t\t}
          \t}
          ''',
              '''\tcase AdapterRESTJSON:
          \t\tif version != RESTJSONAdapterVersion {
          \t\t\treturn nil, fmt.Errorf("%w: unsupported REST/JSON adapter version", ErrCatalogInvalid)
          \t\t}
          \tcase AdapterTabularArtifact:
          \t\tif version != TabularArtifactAdapterVersion {
          \t\t\treturn nil, fmt.Errorf("%w: unsupported tabular artifact adapter version", ErrCatalogInvalid)
          \t\t}
          \t}
          ''', 'tabular adapter version')
          replace('internal/sourceaccess/catalog_service.go',
              '''\tif connection.AdapterKind == AdapterRESTJSON {
          \t\tdefinition, err := normalizeRESTJSONViewDefinition(raw)
          \t\tif err != nil {
          \t\t\treturn nil, errors.Join(ErrCatalogInvalid, err)
          \t\t}
          \t\treturn definition, nil
          \t}
          \treturn normalizeJSONObject(raw, HardMaxDefinitionBytes, "view definition")
          ''',
              '''\tif connection.AdapterKind == AdapterRESTJSON {
          \t\tdefinition, err := normalizeRESTJSONViewDefinition(raw)
          \t\tif err != nil {
          \t\t\treturn nil, errors.Join(ErrCatalogInvalid, err)
          \t\t}
          \t\treturn definition, nil
          \t}
          \tif connection.AdapterKind == AdapterTabularArtifact {
          \t\tdefinition, err := NormalizeTabularArtifactViewDefinition(raw)
          \t\tif err != nil {
          \t\t\treturn nil, errors.Join(ErrCatalogInvalid, err)
          \t\t}
          \t\treturn definition, nil
          \t}
          \treturn normalizeJSONObject(raw, HardMaxDefinitionBytes, "view definition")
          ''', 'tabular view normalization')
          replace('internal/sourceaccess/catalog_service.go',
              'if receipt.BindingID != binding.ID || receipt.BindingVersion != binding.Version || receipt.Completeness != CompletenessComplete {',
              'if receipt.BindingID != binding.ID || receipt.BindingVersion != binding.Version || (receipt.Completeness != CompletenessComplete && receipt.Completeness != CompletenessPartial) {',
              'lookup completeness')
          replace('internal/sourceaccess/catalog_service.go',
              '''\tdefault:
          \t\treturn ErrExecution
          \t}
          \treturn nil
          }
          ''',
              '''\tdefault:
          \t\treturn ErrExecution
          \t}
          \tif connection.AdapterKind == AdapterTabularArtifact {
          \t\tif strings.TrimSpace(receipt.ArtifactID) == "" || !isLowerHex(receipt.ArtifactSHA256, 64) || strings.TrimSpace(receipt.ParserVersion) == "" || len(receipt.ParserVersion) > hardMaxAdapterVersionLen || containsControl(receipt.ParserVersion) {
          \t\t\treturn ErrExecution
          \t\t}
          \t}
          \treturn nil
          }
          ''', 'tabular receipt provenance')

          # Share the catalog definition contract with the dependency-bearing adapter.
          path = Path('internal/documentimport/sourceaccess_adapter.go')
          text = path.read_text()
          text = text.replace('\t"bytes"\n', '', 1).replace('\t"io"\n', '', 1)
          start = text.index('type tabularSourceViewDefinition struct {')
          end = text.index('type tabularArtifactAdapter struct', start)
          text = text[:start] + text[end:]
          text = text.replace('tabularSourceViewDefinition', 'sourceaccess.TabularArtifactViewDefinition')
          text = text.replace('decodeTabularSourceView(view.Definition)', 'sourceaccess.DecodeTabularArtifactViewDefinition(view.Definition)')
          start = text.index('func decodeTabularSourceView(')
          end = text.index('func (s *tabularArtifactSession) readArtifact', start)
          text = text[:start] + text[end:]
          path.write_text(text)

          # Runtime composition supplies the artifact-owning service adapter.
          replace('cmd/api/services_memory.go',
              '\tsourceCatalog := sourceaccess.NewCatalogService(sourceaccess.NewMemoryCatalogRepository(sourceScopes), sourceaccess.EnvironmentSecretResolver{}, sourceaccess.DefaultCatalogAdapters())\n\tdocumentService := documentimport.NewService(documentimport.NewMemoryRepository(), store)\n\tdocumentService.Configure(cfg.MaxArtifactBytes, cfg.DocumentImportAllowUnscannedAnalysis)\n',
              '\tdocumentService := documentimport.NewService(documentimport.NewMemoryRepository(), store)\n\tdocumentService.Configure(cfg.MaxArtifactBytes, cfg.DocumentImportAllowUnscannedAnalysis)\n\tadapters := sourceaccess.DefaultCatalogAdapters()\n\tadapters[sourceaccess.AdapterTabularArtifact] = documentService.SourceAccessAdapter()\n\tsourceCatalog := sourceaccess.NewCatalogService(sourceaccess.NewMemoryCatalogRepository(sourceScopes), sourceaccess.EnvironmentSecretResolver{}, adapters)\n',
              'memory service wiring')
          replace('cmd/api/services_postgres.go',
              '\tsourceCatalog := sourceaccess.NewCatalogService(sourceaccess.NewPostgresCatalogRepository(pool), sourceaccess.EnvironmentSecretResolver{}, sourceaccess.DefaultCatalogAdapters())\n\tdocumentService := documentimport.NewService(documentimport.NewPostgresRepository(pool), store)\n\tdocumentService.Configure(cfg.MaxArtifactBytes, cfg.DocumentImportAllowUnscannedAnalysis)\n',
              '\tdocumentService := documentimport.NewService(documentimport.NewPostgresRepository(pool), store)\n\tdocumentService.Configure(cfg.MaxArtifactBytes, cfg.DocumentImportAllowUnscannedAnalysis)\n\tadapters := sourceaccess.DefaultCatalogAdapters()\n\tadapters[sourceaccess.AdapterTabularArtifact] = documentService.SourceAccessAdapter()\n\tsourceCatalog := sourceaccess.NewCatalogService(sourceaccess.NewPostgresCatalogRepository(pool), sourceaccess.EnvironmentSecretResolver{}, adapters)\n',
              'postgres service wiring')
          PY

          gofmt -w internal/sourceaccess internal/documentimport cmd/api
          go test ./internal/documentimport ./internal/sourceaccess ./internal/assurance ./cmd/api
          go test -tags postgres ./internal/documentimport ./internal/sourceaccess ./internal/assurance ./cmd/api

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/sourceaccess internal/documentimport cmd/api
          git commit -m "feat(sourceaccess): wire governed tabular artifacts"
          git push origin HEAD:codex/issue-61-sourceaccess-t2b-tabular-artifacts
