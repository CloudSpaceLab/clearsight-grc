name: T1c gofmt closeout

on:
  push:
    branches:
      - codex/issue-61-sourceaccess-t1c

permissions:
  contents: write

concurrency:
  group: t1c-gofmt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-61-sourceaccess-t1c
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - name: Normalize and verify Go sources
        run: |
          set -euo pipefail
          gofmt -w $(find cmd internal -name '*.go' -type f)
          go test ./internal/sourceaccess ./internal/evidence ./internal/httpapi ./internal/runtime
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- cmd internal; then
            echo "No formatting changes required."
            exit 0
          fi
          git add cmd internal
          git commit -m "style: normalize T1 source formatting"
          git push origin HEAD:codex/issue-61-sourceaccess-t1c
