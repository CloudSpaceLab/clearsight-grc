name: Snapshot T4 recovery tree

on:
  push:
    branches: [agent/t4-publish-staging]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/t4-recovery
          fetch-depth: 1
      - name: Package exact recovery tree
        run: tar --exclude=.git -C "$GITHUB_WORKSPACE" -czf /tmp/clearsight-t4-recovery.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: clearsight-t4-recovery-${{ github.sha }}
          path: /tmp/clearsight-t4-recovery.tgz
          if-no-files-found: error
          retention-days: 1
