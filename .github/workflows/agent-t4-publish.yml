name: Snapshot T4 web toolchain

on:
  push:
    branches: [agent/t4-publish-staging]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/t4-recovery
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install exact web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Package Node and web dependencies
        run: |
          set -euo pipefail
          tar -C /opt/hostedtoolcache/node/24.18.0/x64 -czf /tmp/node24.18.0-linux-x64.tgz .
          tar -C web -czf /tmp/clearsight-web-node-modules.tgz node_modules
          sha256sum /tmp/node24.18.0-linux-x64.tgz /tmp/clearsight-web-node-modules.tgz > /tmp/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: clearsight-t4-web-toolchain-${{ github.sha }}
          path: |
            /tmp/node24.18.0-linux-x64.tgz
            /tmp/clearsight-web-node-modules.tgz
            /tmp/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
