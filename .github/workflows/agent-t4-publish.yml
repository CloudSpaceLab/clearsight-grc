name: Publish T4 governed enforcement

on:
  push:
    branches: [agent/t4-publish-staging]

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - name: Inspect staged T4 payloads
        run: |
          set -euo pipefail

          cat .t4-patch/part-* | base64 -d > /tmp/t4.patch.xz
          echo '6368f76efbda8ce9d6eecc17b939b3b390a8785e45fa47102e9a991a8e54ff1f  /tmp/t4.patch.xz' | sha256sum -c -
          xz -t /tmp/t4.patch.xz

          { cat .t4-payload/part-*; printf '='; } | base64 -d > /tmp/t4.payload.gz
          sha256sum /tmp/t4.payload.gz
          gzip -t /tmp/t4.payload.gz
          gzip -dc /tmp/t4.payload.gz > /tmp/t4.payload
          file /tmp/t4.payload
          wc -c /tmp/t4.payload
          if tar -tf /tmp/t4.payload > /tmp/t4.payload.list 2>/dev/null; then
            cat /tmp/t4.payload.list
          else
            sed -n '1,120p' /tmp/t4.payload
          fi
          exit 1
