name: Recover T4 staged implementation

on:
  push:
    branches: [agent/t4-publish-staging]

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact staged product and test tree
        run: |
          set -euo pipefail

          cat .t4-patch/part-* | base64 -d > /tmp/t4.patch.xz
          echo '6368f76efbda8ce9d6eecc17b939b3b390a8785e45fa47102e9a991a8e54ff1f  /tmp/t4.patch.xz' | sha256sum -c -
          xz -t /tmp/t4.patch.xz
          xz -dc /tmp/t4.patch.xz > /tmp/t4.patch

          git fetch origin main
          test "$(git rev-parse origin/main)" = 'd95eabaf2ddc43affe45310aa22fc9dd2c40719e'
          git checkout -B agent/t4-recovery origin/main
          git apply --index /tmp/t4.patch

          # Workflow files require a separate workflow-scoped publication path.
          # Recover product code and tests first; CI wiring is restored after validation.
          git restore --source=origin/main --staged --worktree .github/workflows/ci.yml
          git diff --cached --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'wip(aigateway): recover staged T4 implementation'
          git push origin HEAD:refs/heads/agent/t4-recovery
