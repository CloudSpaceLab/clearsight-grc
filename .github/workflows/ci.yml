name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: clearsight
          POSTGRES_USER: clearsight
          POSTGRES_PASSWORD: clearsight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clearsight -d clearsight"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - run: go mod download
      - name: Install PDF and PostgreSQL tools
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils postgresql-client
      - name: Format
        run: |
          files="$(gofmt -l $(find cmd internal -name '*.go' -type f))"
          if [ -n "$files" ]; then
            echo "The following Go files require gofmt:"
            echo "$files"
            exit 1
          fi
      - name: Unit tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: PostgreSQL composition
        run: go test -tags postgres ./...
      - name: Apply migrations
        env:
          PGPASSWORD: clearsight
        run: |
          for migration in migrations/*.up.sql; do
            psql -h localhost -U clearsight -d clearsight -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Source-access tranche acceptance
        env:
          TEST_DATABASE_URL: postgres://clearsight:clearsight@localhost:5432/clearsight?sslmode=disable
        run: bash scripts/verify-sourceaccess-tranche.sh auto
      - name: AI gateway T3 transport acceptance
        run: bash scripts/verify-t3-gateway.sh
      - name: AI governance T4/T5 acceptance
        env:
          TEST_DATABASE_URL: postgres://clearsight:clearsight@localhost:5432/clearsight?sslmode=disable
        run: bash scripts/verify-ai-governance-tranches.sh auto
      - name: Verify deployment migration ledger
        env:
          PGPASSWORD: clearsight
          DATABASE_URL: postgres://clearsight:clearsight@localhost:5432/clearsight_deploy_test?sslmode=disable
          CLEARSIGHT_RECIPIENT_KEYRING: '{"ci-v1":"ERERERERERERERERERERERERERERERERERERERERERE="}'
          CLEARSIGHT_RECIPIENT_ACTIVE_KEY_ID: ci-v1
          CLEARSIGHT_DISTRIBUTION_ACCESS_HMAC_KEY: IiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiI=
        run: |
          createdb -h localhost -U clearsight clearsight_deploy_test
          bash deploy/scripts/migrate.sh migrations
          bash deploy/scripts/migrate.sh migrations
          bash deploy/scripts/seed-demo-foundation.sh
          bash deploy/scripts/seed-demo-foundation.sh
          go run -tags postgres ./cmd/seed-bank-reference \
            -tenant 00000000-0000-4000-8000-000000000001 \
            -legal-entity 00000000-0000-4000-8000-000000000002 \
            -actor 00000000-0000-4000-8000-000000000101 \
            -owner 00000000-0000-4000-8000-000000000107 \
            -contributor 00000000-0000-4000-8000-000000000108 \
            -reviewer 00000000-0000-4000-8000-000000000106 \
            -signatory 00000000-0000-4000-8000-000000000102 >/tmp/reference-acceptance.json
          # A second run must reconcile the same persisted acceptance state rather than duplicate it.
          go run -tags postgres ./cmd/seed-bank-reference \
            -tenant 00000000-0000-4000-8000-000000000001 \
            -legal-entity 00000000-0000-4000-8000-000000000002 \
            -actor 00000000-0000-4000-8000-000000000101 \
            -owner 00000000-0000-4000-8000-000000000107 \
            -contributor 00000000-0000-4000-8000-000000000108 \
            -reviewer 00000000-0000-4000-8000-000000000106 \
            -signatory 00000000-0000-4000-8000-000000000102 >/tmp/reference-acceptance-rerun.json
          python3 - <<'PY'
          import json
          for path in ("/tmp/reference-acceptance.json", "/tmp/reference-acceptance-rerun.json"):
              with open(path, encoding="utf-8") as handle:
                  payload = json.load(handle)
              acceptance = payload["form_policy_acceptance"]
              assert acceptance["exactly_once_matter"] is True, payload
              assert acceptance["matter_id"], payload
              assert acceptance["poor_execution_state"] in ("APPLIED", "REUSED"), payload
              assert acceptance["same_episode_reused_matter"] is True, payload
              assert acceptance["same_episode_response_id"], payload
              assert acceptance["same_episode_response_id"] != acceptance["poor_response_id"], payload
              assert acceptance["same_episode_execution_state"] == "REUSED", payload
          PY
          psql -X "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM routing_policies WHERE tenant_id='00000000-0000-4000-8000-000000000001' AND legal_entity_id='00000000-0000-4000-8000-000000000002' AND code='CLEARSIGHT-DEMO-AUTHORITY'" | grep -qx 1
          psql -X "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM routing_policy_versions WHERE policy_id='00000000-0000-4000-8000-000000000201' AND legal_entity_id='00000000-0000-4000-8000-000000000002' AND version=1" | grep -qx 1
          psql -X "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM effective_authority_routes WHERE source_policy_id='00000000-0000-4000-8000-000000000201'" | grep -qx 11
          psql -X "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT selector_ref FROM effective_authority_routes WHERE source_rule_id='demo-program-authorizer' AND legal_entity_ref='00000000-0000-4000-8000-000000000002' AND object_type='PROGRAM' AND decision_type='program.transition' AND responsibility='AUTHORIZER'" | grep -qx 00000000-0000-4000-8000-000000000101
          migration_copy="$(mktemp -d)"
          cp migrations/*.up.sql "$migration_copy/"
          printf '\n-- checksum mismatch proof\n' >> "$migration_copy/000001_foundation.up.sql"
          if bash deploy/scripts/migrate.sh "$migration_copy" 2>migration-error.log; then
            echo "changed migration unexpectedly succeeded"
            exit 1
          fi
          grep -q "checksum mismatch: 000001_foundation.up.sql" migration-error.log
      - name: Remove deployment migration test database
        if: always()
        env:
          PGPASSWORD: clearsight
        run: dropdb -h localhost -U clearsight --if-exists clearsight_deploy_test
      - name: PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgres://clearsight:clearsight@localhost:5432/clearsight?sslmode=disable
        # Integration packages share one mutable database; serialize package execution
        # so fixture cleanup in one package cannot race another package's test data.
        run: go test -count=1 -p 1 -tags "postgres postgresintegration" ./internal/...
      - name: Oversight reference history and projection acceptance
        env:
          TEST_DATABASE_URL: postgres://clearsight:clearsight@localhost:5432/clearsight?sslmode=disable
        run: |
          go test ./internal/bankverticals -run OversightHistory -count=1
          go test -count=1 -p 1 -tags "postgres postgresintegration" ./internal/oversight
      - name: Vet
        run: go vet ./...
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Reject fixture code from the customer runtime graph
        run: npm run check:runtime-truth
      - name: Rendered state and accessibility tests
        run: npm test
      - run: npm run build