name: CI Autofix
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
  pull-requests: read
jobs:
  autofix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: false
      - name: Normalize modules and Go source
        run: |
          go mod tidy
          gofmt -w $(find cmd internal -name '*.go' -type f)
      - name: Commit deterministic normalization
        run: |
          if git diff --quiet; then
            echo "No normalization changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum cmd internal
          git commit -m "chore: normalize Go modules and formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
