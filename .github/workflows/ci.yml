name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: clearsight
          POSTGRES_USER: clearsight
          POSTGRES_PASSWORD: clearsight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clearsight -d clearsight"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - run: go mod download
      - name: Format
        run: |
          files="$(gofmt -l $(find cmd internal -name '*.go' -type f))"
          if [ -n "$files" ]; then
            echo "The following Go files require gofmt:"
            echo "$files"
            exit 1
          fi
      - name: Unit tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: PostgreSQL composition
        run: go test -tags postgres ./...
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Apply migrations
        env:
          PGPASSWORD: clearsight
        run: |
          for migration in migrations/*.up.sql; do
            psql -h localhost -U clearsight -d clearsight -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgres://clearsight:clearsight@localhost:5432/clearsight?sslmode=disable
        # Integration packages share one mutable database; serialize package execution
        # so fixture cleanup in one package cannot race another package's test data.
        run: go test -p 1 -tags "postgres postgresintegration" ./internal/...
      - name: Vet
        run: go vet ./...
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Rendered state and accessibility tests
        run: npm test
      - run: npm run build
