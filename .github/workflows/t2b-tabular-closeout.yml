name: T2b tabular closeout

on:
  push:
    branches:
      - codex/issue-61-sourceaccess-t2b-tabular-artifacts

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: clearsight
          POSTGRES_USER: clearsight
          POSTGRES_PASSWORD: clearsight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clearsight -d clearsight"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PGPASSWORD: clearsight
      TEST_DATABASE_URL: postgres://clearsight:clearsight@localhost:5432/clearsight?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-61-sourceaccess-t2b-tabular-artifacts
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Add T2b acceptance and architecture receipt
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/verify-sourceaccess-tranche.sh')
          text = path.read_text()
          old = '''if [[ "$tranche" == "auto" ]]; then
            if [[ -f internal/sourceaccess/rest_json_adapter.go && -f internal/sourceaccess/rest_json_read.go ]]; then
              tranche="t2a"
          '''
          new = '''if [[ "$tranche" == "auto" ]]; then
            if [[ -f internal/documentimport/sourceaccess_adapter.go && -f migrations/000032_document_import_tabular_metadata.up.sql ]]; then
              tranche="t2b"
            elif [[ -f internal/sourceaccess/rest_json_adapter.go && -f internal/sourceaccess/rest_json_read.go ]]; then
              tranche="t2a"
          '''
          if old not in text:
              raise SystemExit('auto tranche detection changed')
          text = text.replace(old, new, 1)
          old = '''if [[ "$tranche" != "t0" && "$tranche" != "t1a" && "$tranche" != "t1b" && "$tranche" != "t1c" && "$tranche" != "t2a" ]]; then
            echo "usage: $0 [auto|t0|t1a|t1b|t1c|t2a]" >&2
          '''
          new = '''if [[ "$tranche" != "t0" && "$tranche" != "t1a" && "$tranche" != "t1b" && "$tranche" != "t1c" && "$tranche" != "t2a" && "$tranche" != "t2b" ]]; then
            echo "usage: $0 [auto|t0|t1a|t1b|t1c|t2a|t2b]" >&2
          '''
          if old not in text:
              raise SystemExit('tranche usage guard changed')
          text = text.replace(old, new, 1)
          text = text.replace('if [[ "$tranche" == "t2a" ]]; then\n\t    required_t2a=(', 'if [[ "$tranche" == "t2a" || "$tranche" == "t2b" ]]; then\n\t    required_t2a=(', 1)
          text = text.replace("\t    if compgen -G 'migrations/000032*' >/dev/null; then", "\t    if [[ \"$tranche\" == \"t2a\" ]] && compgen -G 'migrations/000032*' >/dev/null; then", 1)
          needle = '\t    summary="T2a REST/JSON source access passed: fixed HTTPS origin, strict templates, bounded inspect/page/lookup, cursor/ETag positions, secret isolation and schema-drift blocking."\n\t  fi\n'
          addition = '''\t    summary="T2a REST/JSON source access passed: fixed HTTPS origin, strict templates, bounded inspect/page/lookup, cursor/ETag positions, secret isolation and schema-drift blocking."
          \t    if [[ "$tranche" == "t2b" ]]; then
          \t      required_t2b=(
          \t        internal/documentimport/tabular.go
          \t        internal/documentimport/sourceaccess_adapter.go
          \t        internal/documentimport/sourceaccess_catalog_test.go
          \t        internal/documentimport/tabular_postgres_integration_test.go
          \t        internal/sourceaccess/tabular_artifact_definition.go
          \t        migrations/000032_document_import_tabular_metadata.up.sql
          \t        migrations/000032_document_import_tabular_metadata.down.sql
          \t      )
          \t      for file in "${required_t2b[@]}"; do
          \t        test -s "$file" || { echo "missing T2b contract: $file" >&2; exit 1; }
          \t      done
          \t      grep -q 'AdapterTabularArtifact' internal/sourceaccess/contracts_types.go || { echo "tabular artifact adapter kind is missing" >&2; exit 1; }
          \t      grep -q 'tabular_metadata' migrations/000032_document_import_tabular_metadata.up.sql || { echo "tabular parser metadata is not durable" >&2; exit 1; }
          \t      if grep -qiE 'CREATE[[:space:]]+TABLE' migrations/000032_document_import_tabular_metadata.up.sql; then
          \t        echo "T2b introduced a source-row or adapter-specific table" >&2
          \t        exit 1
          \t      fi
          \t      grep -q 'SourceAccessAdapter' cmd/api/services_memory.go || { echo "memory runtime does not register the tabular adapter" >&2; exit 1; }
          \t      grep -q 'SourceAccessAdapter' cmd/api/services_postgres.go || { echo "PostgreSQL runtime does not register the tabular adapter" >&2; exit 1; }
          \t      if [[ -n "${TEST_DATABASE_URL:-}" ]]; then
          \t        psql -X "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='document_imports' AND column_name='tabular_metadata'" | grep -qx 1
          \t      fi
          \t      go test ./internal/documentimport ./internal/sourceaccess ./cmd/api
          \t      go test -tags postgres ./internal/documentimport ./internal/sourceaccess ./internal/assurance ./cmd/api
          \t      summary="T2b governed tabular capture passed: CSV/JSON/NDJSON/XLSX originals, bounded parser receipts, row diagnostics/schema fingerprints and reusable artifact-backed inspect/page/lookup without a source-row table."
          \t    fi
          \t  fi
          '''
          if needle not in text:
              raise SystemExit('T2a summary block changed')
          path.write_text(text.replace(needle, addition, 1))

          path = Path('docs/architecture/connected-source-access.md')
          text = path.read_text()
          marker = '## Current limitations\n'
          addition = '''## Tabular artifact adapter — T2b

          `TABULAR_ARTIFACT` reuses the governed document-import lifecycle for CSV, JSON, NDJSON and XLSX rather than introducing a second file-ingestion stack. The original object remains the only row store. `document_imports.tabular_metadata` retains only bounded parser provenance: format/parser version, row totals and rejections, bounded row diagnostics, resource schemas and schema fingerprints.

          A View references one exact document-import ID and, for multi-sheet XLSX, one exact resource. `INSPECT`, `PAGE` and `LOOKUP` reopen the preserved artifact, verify its recorded size and SHA-256 digest, and reparse it under the same hard resource limits. Page checkpoints are physical row positions over that immutable artifact. Any retained row rejection keeps the operation `PARTIAL`; it is never silently promoted to complete source truth.

          XLSX parsing consumes stored cell values only; formulas and macros are not executed. JSON/NDJSON nested arrays and objects may be represented in native schema metadata but are not coerced into scalar Source Access values. A parser-version mismatch or changed artifact digest is non-executable until the artifact is governed again under the current parser.

          '''
          if marker not in text:
              raise SystemExit('current limitations heading missing')
          text = text.replace(marker, addition + marker, 1)
          text = text.replace('- PostgreSQL and REST/JSON are executable adapters; tabular-file and webhook/event adapters remain T2 work.', '- PostgreSQL, REST/JSON and governed tabular artifacts are executable adapters; webhook/event capture remains T2 work.', 1)
          text = text.replace('- REST, file, event and non-PostgreSQL database adapters are not implemented.', '- Webhook/event and non-PostgreSQL database adapters are not implemented.', 1)
          path.write_text(text)
          PY

          gofmt -w internal/documentimport internal/sourceaccess cmd/api
          go test -race ./internal/documentimport ./internal/sourceaccess ./internal/assurance ./cmd/api
          go test -tags postgres ./internal/documentimport ./internal/sourceaccess ./internal/assurance ./cmd/api

          for migration in migrations/*.up.sql; do
            psql -X "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done
          bash scripts/verify-sourceaccess-tranche.sh t2b
          go test -p 1 -tags "postgres postgresintegration" ./internal/documentimport ./internal/sourceaccess
          go vet ./...

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-sourceaccess-tranche.sh docs/architecture/connected-source-access.md internal/documentimport internal/sourceaccess cmd/api
          git commit -m "test(sourceaccess): close T2b tabular acceptance"
          git push origin HEAD:codex/issue-61-sourceaccess-t2b-tabular-artifacts
