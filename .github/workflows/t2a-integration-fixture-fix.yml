name: T2a integration fixture correction

on:
  push:
    branches:
      - codex/issue-61-sourceaccess-t2a-rest-json

permissions:
  contents: write

concurrency:
  group: t2a-integration-fixture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-61-sourceaccess-t2a-rest-json
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - name: Correct shared-database health assertions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('internal/evidence/source_health_postgres_integration_test.go')
          text = path.read_text()
          old = '''\t// A Source with no observations must still be a valid maintenance candidate.
          \tif changed, err := service.Maintain(ctx, now, 20); err != nil || changed != 0 {
          \t\tt.Fatalf("empty health rollup changed=%d err=%v", changed, err)
          \t}
          '''
          new = '''\t// A Source with no observations must still be a valid maintenance candidate.
          \t// Maintenance is intentionally global and this integration stage shares one
          \t// database across packages, so unrelated stale Sources may also be repaired.
          \tif _, err := service.Maintain(ctx, now, 20); err != nil {
          \t\tt.Fatal(err)
          \t}
          \tseeded, err := service.ListSources(ctx, scopedHealthTenantID, 20)
          \tif err != nil || len(seeded) != 1 || seeded[0].ID != scopedHealthSourceID || seeded[0].Health != HealthUnknown {
          \t\tt.Fatalf("empty fixture source changed during global maintenance: values=%#v err=%v", seeded, err)
          \t}
          '''
          if old not in text:
              raise SystemExit('scoped health empty maintenance assertion changed')
          path.write_text(text.replace(old, new, 1))

          path = Path('internal/integration/evidence_capture_test.go')
          text = path.read_text()
          old = '''\t\tobserved := now.Add(-2 * time.Hour)
          \t\tupdated, err := service.RecordSourceObservation(ctx, evidence.SourceObservation{TenantID: "evidence-bank", SourceID: source.ID, ObservedAt: observed, Success: true, LatencyMS: 75})
          \t\tif err != nil {
          \t\t\tt.Fatal(err)
          \t\t}
          \t\tif updated.Health != evidence.HealthCurrent {
          \t\t\tt.Fatalf("expected current source, got %#v", updated)
          \t\t}
          \t\tchanged, err := service.Maintain(ctx, now, 10)
          '''
          new = '''\t\t// Record a genuinely current observation, then advance the evaluation clock
          \t\t// beyond its freshness window. A historical observation that is already
          \t\t// older than the window is correctly STALE immediately.
          \t\tobserved := now
          \t\tupdated, err := service.RecordSourceObservation(ctx, evidence.SourceObservation{TenantID: "evidence-bank", SourceID: source.ID, ObservedAt: observed, Success: true, LatencyMS: 75})
          \t\tif err != nil {
          \t\t\tt.Fatal(err)
          \t\t}
          \t\tif updated.Health != evidence.HealthCurrent {
          \t\t\tt.Fatalf("expected current source, got %#v", updated)
          \t\t}
          \t\tchanged, err := service.Maintain(ctx, now.Add(2*time.Hour), 10)
          '''
          if old not in text:
              raise SystemExit('evidence freshness transition fixture changed')
          path.write_text(text.replace(old, new, 1))
          PY

          gofmt -w internal/evidence/source_health_postgres_integration_test.go internal/integration/evidence_capture_test.go
          go test ./internal/evidence ./internal/integration
          go test -tags postgres ./internal/evidence ./internal/integration

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/evidence/source_health_postgres_integration_test.go internal/integration/evidence_capture_test.go
          git commit -m "test(evidence): align scoped health integration fixtures"
          git push origin HEAD:codex/issue-61-sourceaccess-t2a-rest-json
