name: UI workspace export
on:
  push:
    branches: [agent/ui-onboarding-finish]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package checkout
        run: tar --exclude=.git -czf /tmp/clearsight-ui-workspace.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: clearsight-ui-workspace
          path: /tmp/clearsight-ui-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1
