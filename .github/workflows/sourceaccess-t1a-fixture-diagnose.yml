name: Source access T1a fixture diagnosis

on:
  push:
    branches:
      - codex/issue-61-sourceaccess-t1a

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-61-sourceaccess-t1a
          fetch-depth: 0
      - name: Materialize matching fixtures
        shell: bash
        run: |
          mkdir -p diagnostics
          {
            grep -R -n -C 20 -E 'TestPostgresEvidenceRepository|TestPostgresMaintenanceBatchesAreBounded|INSERT INTO evidence_sources|endpoint' internal/evidence || true
          } > diagnostics/sourceaccess-t1a-evidence-fixtures.txt
          test -s diagnostics/sourceaccess-t1a-evidence-fixtures.txt
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/sourceaccess-t1a-evidence-fixtures.txt
          git commit -m "chore(sourceaccess): capture legacy evidence fixture"
          git push origin HEAD:codex/issue-61-sourceaccess-t1a