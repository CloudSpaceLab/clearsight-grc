name: T2a REST JSON protocol semantics

on:
  push:
    branches:
      - codex/issue-61-sourceaccess-t2a-rest-json

permissions:
  contents: write

concurrency:
  group: t2a-rest-json-semantics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semantics:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-61-sourceaccess-t2a-rest-json
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - name: Close ETag and header-name semantics
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('internal/sourceaccess/rest_json_read.go')
          text = path.read_text()
          old = '''\t\tnext := Scalar{Kind: ScalarString, Text: response.etag}
          \t\treturn &next, &CheckpointPosition{Kind: CheckpointETag, Value: response.etag}, CompletenessPartial, nil
          '''
          new = '''\t\tnext := Scalar{Kind: ScalarString, Text: response.etag}
          \t\treturn &next, &CheckpointPosition{Kind: CheckpointETag, Value: response.etag}, CompletenessComplete, nil
          '''
          if old not in text:
              raise SystemExit('ETag completeness block changed')
          path.write_text(text.replace(old, new, 1))

          path = Path('internal/sourceaccess/rest_json_definition.go')
          text = path.read_text()
          old = '''func validRESTHeaderName(value string) bool {
          \tvalue = strings.TrimSpace(value)
          \tcanonical := textproto.CanonicalMIMEHeaderKey(value)
          \tif value == "" || canonical == "" || len(value) > 128 || containsControl(value) {
          \t\treturn false
          \t}
          \tswitch canonical {
          '''
          new = '''func validRESTHeaderName(value string) bool {
          \tvalue = strings.TrimSpace(value)
          \tif value == "" || len(value) > 128 || containsControl(value) {
          \t\treturn false
          \t}
          \tfor _, character := range value {
          \t\tif (character >= 'a' && character <= 'z') || (character >= 'A' && character <= 'Z') || (character >= '0' && character <= '9') || strings.ContainsRune("!#$%&'*+-.^_`|~", character) {
          \t\t\tcontinue
          \t\t}
          \t\treturn false
          \t}
          \tcanonical := textproto.CanonicalMIMEHeaderKey(value)
          \tif canonical == "" {
          \t\treturn false
          \t}
          \tswitch canonical {
          '''
          if old not in text:
              raise SystemExit('REST header validation block changed')
          path.write_text(text.replace(old, new, 1))
          PY

          cat > internal/sourceaccess/rest_json_protocol_test.go <<'EOF'
          package sourceaccess

          import (
            "encoding/json"
            "testing"
          )

          func TestRESTJSONETagCheckpointDoesNotMakeSnapshotPartial(t *testing.T) {
            definition := RESTJSONViewDefinition{Pagination: RESTJSONPagination{Mode: RESTJSONPaginationETag}}
            response := restJSONResponse{etag: `"revision-7"`}
            next, position, completeness, err := restNextPosition(definition, response, nil)
            if err != nil || next == nil || position == nil || position.Kind != CheckpointETag || completeness != CompletenessComplete {
              t.Fatalf("ETag snapshot semantics changed: next=%#v position=%#v completeness=%q err=%v", next, position, completeness, err)
            }
          }

          func TestRESTJSONCustomHeaderRequiresHTTPToken(t *testing.T) {
            for _, header := range []string{"X Bad", "X:Bad", "X/Bad", "X@Bad"} {
              raw, _ := json.Marshal(RESTJSONConnectionDefinition{
                BaseURL: "https://bank.example",
                Authentication: RESTJSONAuthentication{Kind: RESTJSONAuthHeader, HeaderName: header},
              })
              if _, err := normalizeRESTJSONConnectionDefinition(raw, "secret://api"); err == nil {
                t.Fatalf("invalid HTTP header name %q was accepted", header)
              }
            }
            raw, _ := json.Marshal(RESTJSONConnectionDefinition{
              BaseURL: "https://bank.example",
              Authentication: RESTJSONAuthentication{Kind: RESTJSONAuthHeader, HeaderName: "X-Bank_API.Key"},
            })
            if _, err := normalizeRESTJSONConnectionDefinition(raw, "secret://api"); err != nil {
              t.Fatalf("valid token header was rejected: %v", err)
            }
          }
          EOF

          gofmt -w $(find cmd internal -name '*.go' -type f)
          go test ./internal/sourceaccess ./internal/assurance ./internal/httpapi ./internal/runtime
          go test -tags postgres ./internal/sourceaccess ./internal/assurance ./internal/httpapi ./internal/runtime
          bash scripts/verify-sourceaccess-tranche.sh t2a

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal
          if git diff --cached --quiet; then
            echo "No protocol semantic changes to publish."
            exit 0
          fi
          git commit -m "fix(sourceaccess): tighten REST protocol semantics"
          git push origin HEAD:codex/issue-61-sourceaccess-t2a-rest-json
