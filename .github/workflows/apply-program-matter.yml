name: Apply Program and Matter foundation

on:
  push:
    branches:
      - agent/program-matter-foundation-implementation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: clearsight
          POSTGRES_USER: clearsight
          POSTGRES_PASSWORD: clearsight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clearsight -d clearsight"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://clearsight:clearsight@localhost:5432/clearsight?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/program-matter-foundation-implementation
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Reconstruct and verify reviewed bundle
        shell: bash
        run: |
          cat .tmp/program-matter.*.b64 > /tmp/program-matter.b64
          base64 -d /tmp/program-matter.b64 > /tmp/program-matter.tgz
          echo '43eb3178e45b305b00ce4bab977bcfb2bd3aa3628707f7c3110ebb078e2ab536  /tmp/program-matter.tgz' | sha256sum -c -
          python - <<'PY'
          import pathlib
          import tarfile

          bundle = pathlib.Path('/tmp/program-matter.tgz')
          with tarfile.open(bundle, 'r:gz') as archive:
              members = archive.getmembers()
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
                  if path.parts[:2] == ('.github', 'workflows'):
                      raise SystemExit('bundle may not modify workflows')
              archive.extractall('.')

          integration_test = pathlib.Path('internal/integration/continuity_test.go')
          source = integration_test.read_text()
          start_marker = "\tif _, err := pool.Exec(ctx, `INSERT INTO tenants"
          end_marker = "\n\n\tservice := continuity.NewService"
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('continuity integration seed block was not found')
          replacement = (
              "    if _, err := pool.Exec(ctx, `INSERT INTO tenants(id,slug,name) VALUES($1::uuid,'continuity-bank','Continuity Bank'),($2::uuid,'other-bank','Other Bank')`, continuityTenantID, continuityOtherTenantID); err != nil {\n"
              "        t.Fatal(err)\n"
              "    }\n"
              "    if _, err := pool.Exec(ctx, `INSERT INTO principals(id,tenant_id,kind,external_ref,display_name) VALUES($2::uuid,$1::uuid,'PERSON','owner','Program Owner'),($3::uuid,$1::uuid,'PERSON','reviewer','Independent Reviewer')`, continuityTenantID, continuityActorID, continuityReviewerID); err != nil {\n"
              "        t.Fatal(err)\n"
              "    }\n"
              "    if _, err := pool.Exec(ctx, `INSERT INTO evidence_sources(id,tenant_id,code,name,source_type,authority_class,expected_freshness_minutes,health) VALUES($2::uuid,$1::uuid,'IAM','Identity directory','SYSTEM','SYSTEM_OF_RECORD',60,'CURRENT')`, continuityTenantID, continuitySourceID); err != nil {\n"
              "        t.Fatal(err)\n"
              "    }"
          )
          integration_test.write_text(source[:start] + replacement + source[end:])
          print(f'extracted {len(members)} reviewed files and corrected pgx seed execution')
          PY
          gofmt -w $(find cmd internal -name '*.go' -type f)

      - name: Validate backend
        run: |
          go mod download
          test -z "$(gofmt -l $(find cmd internal -name '*.go' -type f))"
          go test -race ./...
          go test -tags postgres ./...
          go vet ./...

      - name: Apply migrations
        env:
          PGPASSWORD: clearsight
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          for migration in migrations/*.up.sql; do
            psql -h localhost -U clearsight -d clearsight -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: PostgreSQL integration tests
        run: go test -tags "postgres postgresintegration" ./internal/integration

      - name: Validate web
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Commit and push logical batches
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add AGENTS.md DESIGN.md README.md docs
          git commit -m 'docs: define Program and Matter foundation'
          git push origin HEAD:agent/program-matter-foundation-implementation

          git add migrations internal/continuity
          git commit -m 'feat: add Program and Matter domain foundation'
          git push origin HEAD:agent/program-matter-foundation-implementation

          git add api cmd/api internal/httpapi internal/integration
          git commit -m 'feat: expose Program and Matter APIs'
          git push origin HEAD:agent/program-matter-foundation-implementation

          git add web
          git commit -m 'feat: add Program and Matter workspaces'
          git push origin HEAD:agent/program-matter-foundation-implementation

          git rm -r .tmp .github/workflows/apply-program-matter.yml
          git commit -m 'chore: remove one-use Program and Matter loader'
          git push origin HEAD:agent/program-matter-foundation-implementation

          test -z "$(git status --porcelain)"
