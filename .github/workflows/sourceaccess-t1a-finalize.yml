name: Source access T1a finalizer

on:
  push:
    branches:
      - codex/issue-61-sourceaccess-t1a

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-61-sourceaccess-t1a
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply final review corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          validation = Path("internal/sourceaccess/catalog_validation.go")
          text = validation.read_text()
          old = "\tvalue.Name = strings.TrimSpace(value.Name)\n\tvalue.AdapterVersion = strings.TrimSpace(value.AdapterVersion)\n"
          new = "\tvalue.Name = strings.TrimSpace(value.Name)\n\tvalue.AdapterKind = AdapterKind(strings.TrimSpace(string(value.AdapterKind)))\n\tvalue.AdapterVersion = strings.TrimSpace(value.AdapterVersion)\n"
          if new not in text:
              if old not in text:
                  raise SystemExit("connection normalization anchor not found")
              text = text.replace(old, new, 1)

          old = "\t\tendpoint, ok := reference[\"endpoint\"].(string)\n\t\tif !ok || strings.TrimSpace(endpoint) == \"\" {\n\t\t\treturn ConnectionRevision{}, catalogInvalid(\"reference connections require an endpoint\")\n\t\t}\n"
          new = "\t\tendpoint, ok := reference[\"endpoint\"].(string)\n\t\tendpoint = strings.TrimSpace(endpoint)\n\t\tif !ok || endpoint == \"\" || containsControl(endpoint) {\n\t\t\treturn ConnectionRevision{}, catalogInvalid(\"reference connections require a bounded endpoint without control characters\")\n\t\t}\n\t\treference[\"endpoint\"] = endpoint\n\t\tencoded, err := json.Marshal(reference)\n\t\tif err != nil || len(encoded) > HardMaxDefinitionBytes {\n\t\t\treturn ConnectionRevision{}, catalogInvalid(\"reference connection definition exceeds the size limit\")\n\t\t}\n\t\tvalue.Definition = encoded\n"
          if new not in text:
              if old not in text:
                  raise SystemExit("reference endpoint normalization block not found")
              text = text.replace(old, new, 1)
          validation.write_text(text)

          scanner = Path("internal/sourceaccess/catalog_postgres_scan.go")
          text = scanner.read_text()
          if '"context"' not in text.split(')', 1)[0]:
              text = text.replace('import (\n\t"database/sql"', 'import (\n\t"context"\n\t"database/sql"', 1)
          old = "func catalogReadError(err error) error {\n\tif errors.Is(err, pgx.ErrNoRows) {\n\t\treturn ErrCatalogNotFound\n\t}\n\treturn ErrCatalogStorage\n}\n"
          new = "func catalogReadError(err error) error {\n\tif errors.Is(err, context.Canceled) || errors.Is(err, context.DeadlineExceeded) {\n\t\treturn err\n\t}\n\tif errors.Is(err, pgx.ErrNoRows) {\n\t\treturn ErrCatalogNotFound\n\t}\n\tvar databaseError *pgconn.PgError\n\tif errors.As(err, &databaseError) && (databaseError.Code == \"22P02\" || databaseError.Code == \"22023\") {\n\t\treturn ErrCatalogInvalid\n\t}\n\treturn ErrCatalogStorage\n}\n"
          if new not in text:
              if old not in text:
                  raise SystemExit("catalogReadError block not found")
              text = text.replace(old, new, 1)
          old = "func catalogWriteError(err error) error {\n\tif err == nil {\n\t\treturn nil\n\t}\n\tif errors.Is(err, pgx.ErrNoRows) {\n"
          new = "func catalogWriteError(err error) error {\n\tif err == nil {\n\t\treturn nil\n\t}\n\tif errors.Is(err, context.Canceled) || errors.Is(err, context.DeadlineExceeded) {\n\t\treturn err\n\t}\n\tif errors.Is(err, pgx.ErrNoRows) {\n"
          if new not in text:
              if old not in text:
                  raise SystemExit("catalogWriteError block not found")
              text = text.replace(old, new, 1)
          scanner.write_text(text)

          service = Path("internal/evidence/service.go")
          text = service.read_text()
          if '"unicode"' not in text.split(')', 1)[0]:
              text = text.replace('\t"time"\n', '\t"time"\n\t"unicode"\n', 1)
          old = 'len(input.Endpoint) > 32<<10 || strings.IndexByte(input.Endpoint, 0) >= 0 || strings.ContainsAny(input.Endpoint, "\\r\\n")'
          new = 'len(input.Endpoint) > 32<<10 || strings.IndexFunc(input.Endpoint, unicode.IsControl) >= 0'
          if new not in text:
              if old not in text:
                  raise SystemExit("endpoint service validation not found")
              text = text.replace(old, new, 1)
          service.write_text(text)

          ownership = Path("docs/architecture/durable-schema-ownership.md")
          text = ownership.read_text().replace(
              "assurance and future form, evidence and workflow consumers",
              "assurance and configured consumers",
          )
          ownership.write_text(text)
          PY
      - name: Format and test
        shell: bash
        run: |
          gofmt -w internal/sourceaccess/*.go internal/evidence/service.go
          git diff --check
          go test ./internal/sourceaccess ./internal/evidence
          go test -tags postgres ./internal/sourceaccess ./internal/evidence
      - name: Commit final branch state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sourceaccess-t1a-finalize.yml
          git add internal/sourceaccess internal/evidence/service.go docs/architecture/durable-schema-ownership.md
          git commit -m "fix(sourceaccess): finalize durable catalog invariants"
          git push origin HEAD:codex/issue-61-sourceaccess-t1a
