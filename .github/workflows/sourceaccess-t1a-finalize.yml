name: Source access T1a finalizer

on:
  push:
    branches:
      - codex/issue-61-sourceaccess-t1a

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-61-sourceaccess-t1a
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Update checked documentation and compatibility types
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f"expected text not found in {path}")
              file.write_text(text.replace(old, new, 1))

          ownership = Path("docs/architecture/durable-schema-ownership.md")
          text = ownership.read_text()
          if "| `source_connections` |" not in text:
              anchor = "| `evidence_sources` | active authoritative state | evidence | evidence service/installers | evidence health and continuity source-quality | active/inactive source configuration | retain while assessments depend on source | evidence repository; continuity source tests |\n"
              rows = (
                  "| `source_connections` | active authoritative state | source access | source catalog repository and Evidence Source creation/migration | source-access configuration and bounded runtime composition | immutable revision lineage with one current effective revision per Connection | retain revision history while Views, evidence or reconstruction require it | `internal/sourceaccess/catalog_postgres_connection.go`; migration `000030_source_access_catalog`; source catalog integration |\n"
                  "| `source_views` | active authoritative state | source access | source catalog repository | source-access configuration, assurance and bounded consumers | immutable revision lineage tied to an exact Connection revision | retain revision history while Bindings, evidence or reconstruction require it | `internal/sourceaccess/catalog_postgres_view.go`; migration `000030_source_access_catalog`; source catalog integration |\n"
                  "| `source_bindings` | active authoritative state | source access | source catalog repository | assurance and future form, evidence and workflow consumers | immutable revision lineage tied to an exact View revision | retain revision history while consumers or reconstruction require it | `internal/sourceaccess/catalog_postgres_binding.go`; migration `000030_source_access_catalog`; source catalog integration |\n"
              )
              if anchor not in text:
                  raise SystemExit("evidence_sources ownership row not found")
              ownership.write_text(text.replace(anchor, anchor + rows, 1))

          replace_once(
              "docs/README.md",
              "- transient reusable Source Connection/View/Binding contracts with bounded PostgreSQL schema, page, lookup and aggregate capabilities;",
              "- durable versioned Source Connection/View/Binding catalog with bounded PostgreSQL schema, page, lookup and aggregate capabilities;",
          )
          replace_once(
              "web/src/types.ts",
              "owner_principal_id?: string; endpoint?: string; expected_freshness_minutes",
              "owner_principal_id?: string; expected_freshness_minutes",
          )

          service = Path("internal/evidence/service.go")
          text = service.read_text()
          validation = (
              "\tinput.Endpoint = strings.TrimSpace(input.Endpoint)\n"
              "\tif len(input.Endpoint) > 32<<10 || strings.IndexByte(input.Endpoint, 0) >= 0 || strings.ContainsAny(input.Endpoint, \"\\r\\n\") {\n"
              "\t\treturn Source{}, fmt.Errorf(\"endpoint must be no more than 32768 bytes and contain no control characters\")\n"
              "\t}\n"
          )
          if validation not in text:
              anchor = (
                  "\tif input.ExpectedFreshnessMinutes < 1 || input.ExpectedFreshnessMinutes > 525600 {\n"
                  "\t\treturn Source{}, fmt.Errorf(\"expected_freshness_minutes must be between 1 and 525600\")\n"
                  "\t}\n"
              )
              if anchor not in text:
                  raise SystemExit("CreateSource freshness validation not found")
              service.write_text(text.replace(anchor, anchor + validation, 1))

          validation_file = Path("internal/sourceaccess/catalog_validation.go")
          text = validation_file.read_text()
          old = (
              "\t\tvar reference map[string]any\n"
              "\t\tif err := json.Unmarshal(value.Definition, &reference); err != nil || strings.TrimSpace(fmt.Sprint(reference[\"endpoint\"])) == \"\" {\n"
              "\t\t\treturn ConnectionRevision{}, catalogInvalid(\"reference connections require an endpoint\")\n"
              "\t\t}\n"
          )
          new = (
              "\t\tvar reference map[string]any\n"
              "\t\tif err := json.Unmarshal(value.Definition, &reference); err != nil {\n"
              "\t\t\treturn ConnectionRevision{}, catalogInvalid(\"reference connection definition is invalid\")\n"
              "\t\t}\n"
              "\t\tendpoint, ok := reference[\"endpoint\"].(string)\n"
              "\t\tif !ok || strings.TrimSpace(endpoint) == \"\" {\n"
              "\t\t\treturn ConnectionRevision{}, catalogInvalid(\"reference connections require an endpoint\")\n"
              "\t\t}\n"
          )
          if old in text:
              validation_file.write_text(text.replace(old, new, 1))

          catalog_test = Path("internal/sourceaccess/catalog_test.go")
          text = catalog_test.read_text()
          text = text.replace('string(reloadedConnection.Definition) != `{"database":"risk"}`', 'string(reloadedConnection.Definition) != `{}`')
          text = text.replace('Definition: json.RawMessage(`{"database":"risk"}`),', 'Definition: json.RawMessage(`{}`),')
          catalog_test.write_text(text)

          migration = Path("migrations/000030_source_access_catalog.up.sql")
          text = migration.read_text()
          constraint = "ALTER TABLE source_connections ADD CONSTRAINT source_connections_reference_shape_ck CHECK (adapter_kind<>'REFERENCE' OR (adapter_version='reference-v1' AND secret_ref='' AND declared_capabilities='[]'::jsonb AND verified_capabilities='[]'::jsonb AND jsonb_typeof(definition->'endpoint')='string' AND NULLIF(btrim(definition->>'endpoint'),'') IS NOT NULL));\n"
          if constraint not in text:
              anchor = ");\nCREATE UNIQUE INDEX source_connections_current_id_idx"
              if anchor not in text:
                  raise SystemExit("source_connections table terminator not found")
              migration.write_text(text.replace(anchor, ");\n" + constraint + "CREATE UNIQUE INDEX source_connections_current_id_idx", 1))
          PY
      - name: Format Go files
        shell: bash
        run: |
          gofmt -w internal/sourceaccess/*.go internal/evidence/model.go internal/evidence/postgres.go internal/evidence/source_catalog*.go internal/evidence/service.go
          git diff --check
      - name: Commit generated updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/durable-schema-ownership.md docs/README.md web/src/types.ts internal/evidence/service.go internal/sourceaccess internal/evidence/model.go internal/evidence/postgres.go internal/evidence/source_catalog*.go migrations/000030_source_access_catalog.up.sql
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(sourceaccess): format and register durable catalog"
          git push origin HEAD:codex/issue-61-sourceaccess-t1a
