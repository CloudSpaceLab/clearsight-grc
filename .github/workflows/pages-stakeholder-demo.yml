name: Stakeholder demo
on:
  push:
    branches: [agent/ui-onboarding-finish]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: stakeholder-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Build static stakeholder demo
        env:
          VITE_STATIC_DEMO: "true"
          VITE_API_BASE_URL: ""
        run: npm run build -- --base=/clearsight-grc/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  screenshots:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Capture product states
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          mkdir -p screenshots/stakeholder-demo
          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size "1440,1100" --wait-for-timeout 3500 --full-page "${PAGE_URL}?tour=on#today" screenshots/stakeholder-demo/01-executive-introduction.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size "1440,1100" --wait-for-timeout 3500 --full-page "${PAGE_URL}?tour=off#today" screenshots/stakeholder-demo/02-today-operating-brief.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size "1440,1100" --wait-for-timeout 3500 --full-page "${PAGE_URL}?tour=off#programs/program-ndpa" screenshots/stakeholder-demo/03-program-evidence-status.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size "1440,1100" --wait-for-timeout 3500 --full-page "${PAGE_URL}?tour=off#work/matters/matter-gaid-change" screenshots/stakeholder-demo/04-regulatory-change-record.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size "1440,1100" --wait-for-timeout 3500 --full-page "${PAGE_URL}?tour=off#imports" screenshots/stakeholder-demo/05-document-import-review.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --device "iPhone 13" --wait-for-timeout 3500 --full-page "${PAGE_URL}?tour=off#today" screenshots/stakeholder-demo/06-mobile-today.png
      - uses: actions/upload-artifact@v4
        with:
          name: stakeholder-demo-screenshots
          path: screenshots/stakeholder-demo
          if-no-files-found: error
          retention-days: 7
