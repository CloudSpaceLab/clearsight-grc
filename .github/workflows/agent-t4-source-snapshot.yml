name: Agent T4 source snapshot

on:
  push:
    branches: [agent/t4-toolchain-snapshot]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Package exact working tree
        run: tar --exclude=.git -C "$GITHUB_WORKSPACE" -czf /tmp/clearsight-t4-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: clearsight-t4-source-${{ github.sha }}
          path: /tmp/clearsight-t4-source.tgz
          if-no-files-found: error
          retention-days: 1
