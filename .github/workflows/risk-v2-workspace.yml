name: Prepare v2 review workspace
on:
  push:
    branches: [agent/462-risk-v2-workspace-20261023]
    paths: [.github/workflows/risk-v2-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ba284eb24b01141666c93783c15221263a13d7b8
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore locked web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Package tracked text source and review dependencies
        run: |
          mkdir -p /tmp/clearsight-workspace
          python3 - <<'PY'
          import pathlib, subprocess, tarfile
          excluded = {'.png', '.jpg', '.jpeg', '.gif', '.webp', '.zip', '.pdf', '.docx', '.xlsx', '.pptx', '.woff', '.woff2', '.ttf', '.ico'}
          with tarfile.open('/tmp/clearsight-workspace/source.tar.gz', 'w:gz') as archive:
              for name in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0'):
                  if name and pathlib.Path(name).suffix.lower() not in excluded:
                      archive.add(name, recursive=False)
          PY
          tar -czf /tmp/clearsight-workspace/web-dependencies.tar.gz web/node_modules
          cp "$(command -v node)" /tmp/clearsight-workspace/node
          gzip /tmp/clearsight-workspace/node
          printf '%s\n' "$(git rev-parse HEAD)" > /tmp/clearsight-workspace/revision.txt
          cd /tmp/clearsight-workspace
          sha256sum source.tar.gz web-dependencies.tar.gz node.gz > SHA256SUMS
          ls -lh
      - uses: actions/upload-artifact@v4
        with:
          name: clearsight-review-source-ba284eb
          path: |
            /tmp/clearsight-workspace/source.tar.gz
            /tmp/clearsight-workspace/revision.txt
            /tmp/clearsight-workspace/SHA256SUMS
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: clearsight-review-dependencies-ba284eb
          path: /tmp/clearsight-workspace/web-dependencies.tar.gz
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: clearsight-review-node24
          path: /tmp/clearsight-workspace/node.gz
          retention-days: 1
